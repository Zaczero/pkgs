[project]
name = "pyo3stubs"
version = "0.1.0"
requires-python = ">=3.11"
# libcst backs the stub docstring generator (gen.py); mypy backs the stub
# validity gate (mypy.api) and the stub/runtime oracle (mypy.stubtest);
# tree-sitter parses the Rust sources the source-scanning gates read.
dependencies = [
  "libcst",
  "mypy>=1.15",
  "tree-sitter>=0.25",
  "tree-sitter-rust>=0.24",
]

[project.scripts]
pyo3stubs = "pyo3stubs.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["pyo3stubs"]

[tool.mypy]
strict = true

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Fixture stub follows the toolkit's own convention: the docstring lives on
# the final (canonical) @overload variant.
"tests/fixtures/fakepkg/_lib.pyi" = ["D418"]
