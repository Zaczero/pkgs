[project]
name = "pyo3stubs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "libcst",
  "mypy>=1.15",
  # The checker is Node-based and reports what mypy does not, and vice versa.
  "pyright>=1.1.400",
  "tree-sitter>=0.25",
  "tree-sitter-rust>=0.24",
]

[project.scripts]
pyo3stubs = "pyo3stubs.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-timeout>=2.4", "pytest-xdist[psutil]>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyo3stubs"]

[tool.ci]
freethreaded-test-exclusion = """
tree-sitter-rust 0.24.2 supplies only GIL-enabled ABI wheels and its source
build fails on free-threaded CPython. Restore these tests when the parser
provides a compatible build.
"""

[tool.mypy]
strict = true

[tool.pyright]
include = ["pyo3stubs", "tests"]
pythonPlatform = "All"
pythonVersion = "3.11"
strict = ["pyo3stubs"]

[tool.ruff]
extend = "../ruff.toml"
