[project]
name = "pyo3stubs"
version = "0.1.0"
requires-python = ">=3.11"
# The doc generator, mypy oracle, and Rust parser have no PyPy wheels. Their
# gates report themselves skipped there; the interpreter-neutral gates still
# exercise the package's PyPy extension.
dependencies = [
  "libcst; platform_python_implementation == 'CPython'",
  "mypy>=1.15; platform_python_implementation == 'CPython'",
  "tree-sitter>=0.25; platform_python_implementation == 'CPython'",
  "tree-sitter-rust>=0.24; platform_python_implementation == 'CPython'",
]

[project.scripts]
pyo3stubs = "pyo3stubs.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-timeout>=2.4", "pytest-xdist[psutil]>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyo3stubs"]

[tool.mypy]
strict = true

[tool.ruff]
extend = "../ruff.toml"
