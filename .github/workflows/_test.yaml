name: Test & Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build-runners: ${{ steps.resolve.outputs.build-runners }}
      import-name: ${{ steps.resolve.outputs.import-name }}
      is-release: ${{ steps.resolve.outputs.is-release }}
      is-rusty: ${{ steps.resolve.outputs.is-rusty }}
      pypy: ${{ steps.resolve.outputs.pypy }}
      rust-toolchain: ${{ steps.resolve.outputs.rust-toolchain }}
      test-matrix: ${{ steps.resolve.outputs.test-matrix }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/matrix.py "$PACKAGE"

  test-rust:
    needs: resolve
    if: needs.resolve.outputs.is-rusty == 'true'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Empty: avoid RUSTFLAGS env overriding .cargo/config.toml target-cpu.
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: nextest

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # Rust tests that touch the Python boundary run an embedded interpreter,
      # which does not inherit a launcher-configured module search path -- the
      # package's own runtime dependencies have to be handed to it explicitly.
      # No `python-version` above and no PYO3_PYTHON here: pyo3 links whatever
      # `python3` the runner provides, and installing for that same interpreter
      # is what keeps the wheel ABI matching. Installing for a different one
      # fails as an *incompatible* extension module rather than a missing
      # package, which reads nothing like the real cause.
      - name: Install embedded interpreter dependencies
        shell: bash
        run: |
          set -euo pipefail
          python="$(command -v python3)"
          echo "embedded interpreter: $python ($("$python" -V))"
          cd "$PACKAGE"
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/embedded-requirements.txt"
          uv pip install --python "$python" --target "$RUNNER_TEMP/embedded-deps" \
            -r "$RUNNER_TEMP/embedded-requirements.txt"
          echo "PYTHONPATH=$RUNNER_TEMP/embedded-deps" >> "$GITHUB_ENV"

      # Practical behavior only — no clippy/fmt/lint gates in CI.
      - name: Test Rust debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          cargo nextest run --no-tests pass

      - name: Test Rust release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          cargo nextest run --no-tests pass --release

  test:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ inputs.package }}
      FREETHREADED: ${{ matrix.freethreaded }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && matrix.primary == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          cache-suffix: ${{ env.PACKAGE }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: >-
            ${{ github.ref == 'refs/heads/main'
                && (matrix.primary == 'true' || runner.os != 'Linux') }}
          rustflags: ""

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Package before-test hook
        if: hashFiles(format('{0}/tools/ci_before_test.sh', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          bash "$PACKAGE/tools/ci_before_test.sh"

      - name: Test Python
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          # The free-threaded cell is also the debug arm. `dev` turns on
          # debug_assertions and overflow-checks, which release omits and which
          # nothing else in CI exercises -- every other cell builds release via
          # maturin's PEP 517 default, which is what publishes. Free-threaded is
          # where a latent race is likeliest to trip an assertion.
          if [ "$FREETHREADED" = "true" ]; then
            export MATURIN_PEP517_ARGS="--profile dev"
            export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} -n 0"
          fi
          uv sync ${{ matrix.uv-sync-args }} --python "${{ matrix.python-version }}"
          if [ "$FREETHREADED" = "true" ]; then
            uv run --python "${{ matrix.python-version }}" python -c \
              'import importlib, sys; importlib.import_module("${{ needs.resolve.outputs.import-name }}"); assert not sys._is_gil_enabled()'
          fi
          uv run --python "${{ matrix.python-version }}" python -m pytest tests

      - name: Show compiler cache statistics
        if: always() && needs.resolve.outputs.is-rusty == 'true' && env.SCCACHE_GHA_RW_MODE == 'READ_WRITE'
        shell: bash
        run: |
          "$SCCACHE_PATH" --show-stats

      - name: Check package quality
        if: matrix.primary == 'true' && hashFiles(format('{0}/tools/check.py', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          uv run --python "${{ matrix.python-version }}" --with 'pyright>=1.1.411' \
            python tools/check.py

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.resolve.outputs.build-runners) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ inputs.package }}
      CIBUILDWHEEL_VERSION: "4.1.0"
      # Native arch only — avoids win32 from auto on windows-latest; pairs with
      # windows-11-arm for ARM64 wheels.
      CIBW_ARCHS: native
      CIBW_BUILD_FRONTEND: build[uv]
      CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0"
      CIBW_ENVIRONMENT_PASS_LINUX: ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN MATURIN_PEP517_ARGS RUSTUP_TOOLCHAIN SCCACHE_GHA_ENABLED SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH
      CIBW_TEST_COMMAND: python -c "import ${{ needs.resolve.outputs.import-name }}"
      # Wheels built here are what publish. maturin's PEP 517 default is `--release`,
      # which is now the fast local profile (thin LTO, unstripped) — publishing that
      # would ship a ~5x larger artifact. `release-dist` is the published configuration:
      # fat LTO, one codegen unit, DWARF dropped, symbol table kept for named frames.
      MATURIN_PEP517_ARGS: "--profile release-dist"
      RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust-toolchain }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      CIBW_BEFORE_ALL_LINUX:
        'set -eu; if command -v dnf >/dev/null; then dnf install -y sqlite; else apk add --no-cache sqlite; fi;
        curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup-init.sh;
        sh rustup-init.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          enable-cache: true
          cache-suffix: ${{ env.PACKAGE }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Rewrite README for PyPI
        shell: bash
        run: python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "${{ github.ref_name }}"

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: ${{ runner.os != 'Linux' }}
          rustflags: ""

      - name: Install cargo-about
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" != Linux ]; then
            exit
          fi

          sccache_dir=$(dirname "$SCCACHE_PATH")
          test_command="python -c \"import ${{ needs.resolve.outputs.import-name }}\""
          if [ "$SCCACHE_GHA_RW_MODE" = READ_WRITE ]; then
            test_command+=" && /opt/sccache/sccache --show-stats"
          fi
          {
            printf '%s\n' "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $sccache_dir:/opt/sccache:ro"
            printf '%s\n' "CIBW_ENVIRONMENT_LINUX=PATH=\"\$HOME/.cargo/bin:\$PATH\" RUSTC_WRAPPER=/opt/sccache/sccache SCCACHE_GHA_RW_MODE=$SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            printf '%s\n' "CIBW_TEST_COMMAND=$test_command"
          } >> "$GITHUB_ENV"

      - name: Generate license files
        if: needs.resolve.outputs.is-release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/gen_licenses.py "$PACKAGE"

      - name: Build wheels
        if: needs.resolve.outputs.is-rusty == 'true'
        env:
          # PyPy opt-in only (cibuildwheel 4 default is no pp*). Free-threaded
          # 3.14t wheels need no enable (cpython-freethreading removed in 4.x).
          CIBW_ENABLE: ${{ needs.resolve.outputs.pypy == 'true' && 'pypy' || '' }}
        shell: bash
        run: |
          # Unset empty enable so we do not override tool defaults with "".
          if [ -z "${CIBW_ENABLE}" ]; then
            unset CIBW_ENABLE
          fi
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --output-dir dist \
            "$PACKAGE"

      - name: Build package
        if: needs.resolve.outputs.is-rusty == 'false'
        shell: bash
        run: uv build -o dist "$PACKAGE"

      - name: Build sdist
        if: needs.resolve.outputs.is-rusty == 'true' && matrix.runner == 'ubuntu-latest'
        shell: bash
        run: uv build --sdist -o dist "$PACKAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: dist-${{ env.PACKAGE }}-${{ matrix.runner }}
          path: dist
          if-no-files-found: error
