name: Test & Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

      plan:
        required: true
        type: string

      native-changed:
        type: boolean
        required: true

permissions:
  contents: read

env:
  PACKAGE: ${{ inputs.package }}
  PACKAGE_TYPE: ${{ fromJson(inputs.plan).type }}
  IMPORT_NAME: ${{ fromJson(inputs.plan).import-name }}
  CARGO_PACKAGE: ${{ fromJson(inputs.plan).crate }}
  PYTHONDEVMODE: "1"

jobs:
  test-rust:
    if: fromJson(inputs.plan).type == 'rust'

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.plan).rust-test-runners }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Build and test Rust debug and release
        shell: bash
        run: bash .github/scripts/test_rust.sh

  test-address-sanitizer:
    if: fromJson(inputs.plan).crate != ''

    runs-on: ubuntu-26.04

    env:
      MATURIN_PEP517_ARGS: --profile dev
      PYTHONMALLOC: malloc
      # Embedded CPython retains process-lifetime allocations after tests finish.
      ASAN_OPTIONS: ${{ fromJson(inputs.plan).type == 'rust' && 'detect_leaks=1' || 'detect_leaks=0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          working-directory: ${{ inputs.package }}
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          components: rust-src
          cache-key: ${{ inputs.package }}-address-sanitizer
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Prepare embedded Python
        if: fromJson(inputs.plan).type != 'rust'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project "$PACKAGE" --no-dev
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          {
            echo "PYO3_PYTHON=$python"
            echo "PYTHONPATH=$("$python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          } >> "$GITHUB_ENV"
          dirname "$python" >> "$GITHUB_PATH"

      - name: Test instrumented Rust and standard library
        shell: bash
        run: |
          set -euo pipefail
          args=(--locked -p "$CARGO_PACKAGE" --target x86_64-unknown-linux-gnu -Z build-std
            --config 'target.x86_64-unknown-linux-gnu.rustflags=["-Zsanitizer=address"]')
          status=0
          cargo nextest run "${args[@]}" || status=$?
          if [[ "$status" == 4 && "$PACKAGE_TYPE" != rust ]]; then
            cargo nextest list "${args[@]}" --message-format json > "$RUNNER_TEMP/rust-tests.json"
            count="$(jq -er '."test-count" | numbers' "$RUNNER_TEMP/rust-tests.json")"
            if [[ "$count" == 0 ]]; then
              echo "::notice::The instrumented package targets contain no Rust tests."
              exit 0
            fi
          fi
          exit "$status"

  test-miri:
    if: fromJson(inputs.plan).crate != '' && inputs.native-changed

    runs-on: ubuntu-26.04

    env:
      # File-backed tests use uniquely owned host fixtures.
      # Capture allocation backtraces on local reruns instead of every CI allocation.
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-disable-leak-backtraces

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          components: miri, rust-src
          cache-key: ${{ inputs.package }}-miri
          cache-directories: ~/.cache/miri
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Interpret Rust tests
        shell: bash
        run: |
          set -euo pipefail
          PYO3_PYTHON="$(command -v python3)"
          export PYO3_PYTHON
          args=(--locked -p "$CARGO_PACKAGE" --profile default-miri)
          status=0
          cargo miri nextest run "${args[@]}" || status=$?
          if [[ "$status" == 4 && "$PACKAGE_TYPE" != rust ]]; then
            cargo miri nextest list "${args[@]}" --message-format json > "$RUNNER_TEMP/rust-tests.json"
            count="$(jq -er '."test-count" | numbers' "$RUNNER_TEMP/rust-tests.json")"
            if [[ "$count" == 0 ]]; then
              echo "::notice::The interpreted package targets contain no Rust tests."
              exit 0
            fi
          fi
          exit "$status"

  test:
    if: fromJson(inputs.plan).type != 'rust'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.plan).test-matrix }}

    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: ${{ inputs.package }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ inputs.package }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: fromJson(inputs.plan).crate != ''
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' && matrix.primary }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: fromJson(inputs.plan).crate != ''
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: fromJson(inputs.plan).crate != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Package before-test hook
        if: hashFiles(format('{0}/tools/ci_before_test.sh', inputs.package)) != ''
        shell: bash
        run: bash "$PACKAGE/tools/ci_before_test.sh"

      - name: Test Python
        env:
          DEPENDENCY_GROUP: ${{ matrix.dependency-group }}
          FREETHREADED: ${{ matrix.freethreaded }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [[ "$FREETHREADED" == true || "$PYTHON_VERSION" == pypy* ]]; then
            export MATURIN_PEP517_ARGS="--profile dev"
            export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} -n 0"
          fi
          # PyPI brotli 1.2.0 re-enables the GIL when imported; HTTPX2's test
          # client imports it whenever installed. Drop this once a brotli
          # release declares free-threading support.
          if [[ "$PACKAGE" == starlette-compress && "$FREETHREADED" == true ]]; then
            uv sync --no-default-groups --group "$DEPENDENCY_GROUP" \
              --no-install-package brotli
          else
            uv sync --no-default-groups --group "$DEPENDENCY_GROUP"
          fi
          uv run --no-sync python - "$IMPORT_NAME" <<'PY'
          import importlib
          import sys
          import sysconfig
          importlib.import_module(sys.argv[1])
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert not sys._is_gil_enabled()
          PY
          pytest_args=(tests --ignore=tests/tooling --ignore=tests/test_public_docs.py)
          if [[ "$FREETHREADED" == true ]]; then
            pytest_args+=(-n 0)
          fi
          uv run --no-sync python -m pytest "${pytest_args[@]}"

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: fromJson(inputs.plan).crate != '' && matrix.primary
        with:
          tool: nextest

      - name: Test embedded Rust against the Python test installation
        if: fromJson(inputs.plan).crate != '' && matrix.primary
        shell: bash
        run: |
          set -euo pipefail
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          PYO3_PYTHON="$python"
          PYTHONPATH="$("$python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          PATH="$(dirname "$python"):$PATH"
          export PYO3_PYTHON PYTHONPATH PATH
          bash .github/scripts/test_rust.sh

      - name: Check Python types
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == fromJson(inputs.plan).python-versions[0]
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          python="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          uv tool run pyright --pythonpath "$python"

      - name: Audit Python dependencies
        if: matrix.primary
        shell: bash
        run: uv audit --project "$PACKAGE" --locked

  build:
    if: fromJson(inputs.plan).type != 'rust'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.plan).build-matrix }}

    runs-on: ${{ matrix.runner }}

    env:
      RUSTUP_TOOLCHAIN: ${{ fromJson(inputs.plan).rust-toolchain }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          python-version: ${{ fromJson(inputs.plan).primary-python }}
          working-directory: ${{ inputs.package }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: fromJson(inputs.plan).crate != ''
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-save-if: false
          cache-targets: false

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: fromJson(inputs.plan).crate != ''
        with:
          tool: cargo-about@0.9.2

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: fromJson(inputs.plan).crate != ''
        with:
          version: v0.17.0

      - name: Prepare distributions
        env:
          REF_NAME: ${{ github.ref_name }}
          PUBLISHABLE: ${{ fromJson(inputs.plan).publishable }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "$REF_NAME"
          if [ "$PUBLISHABLE" = true ]; then
            python3 .github/scripts/gen_licenses.py "$PACKAGE"
          fi
          if [ -f "$PACKAGE/Cargo.toml" ]; then
            echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = Linux ]; then
              echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $(dirname "$SCCACHE_PATH"):/opt/sccache:ro" >> "$GITHUB_ENV"
            fi
          fi
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        if: fromJson(inputs.plan).crate != ''
        with:
          package-dir: ${{ inputs.package }}
          output-dir: dist
        env:
          CIBW_ARCHS: native
          CIBW_BUILD: ${{ matrix.abi == 'abi3t' && 'cp315t-*' || '*' }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_INHERIT: "test-command; environment-linux; environment-macos"
          CIBW_ENABLE: ${{ fromJson(inputs.plan).pypy && 'pypy' || '' }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh &&
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$HOME/.cargo/bin:$PATH" RUSTC_WRAPPER=/opt/sccache/sccache
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0"
          CIBW_ENVIRONMENT_PASS_LINUX: >-
            IMPORT_NAME ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN
            MATURIN_PEP517_ARGS RUSTUP_TOOLCHAIN SCCACHE_GHA_ENABLED SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH
          MATURIN_PEP517_ARGS: ${{ matrix.abi == 'abi3t' && '--profile release-dist --features pyo3/abi3t-py315' || '--profile release-dist' }}
          CIBW_TEST_COMMAND: >-
            python -c "import importlib, os; importlib.import_module(os.environ['IMPORT_NAME'])"

      - name: Build source distribution
        if: fromJson(inputs.plan).crate != '' && matrix.runner == 'ubuntu-26.04' && matrix.abi == 'optimized'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE/.cargo"
          cp .cargo/config.toml "$PACKAGE/.cargo/config.toml"
          uv build --project "$PACKAGE" --sdist --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Build Python distributions
        if: fromJson(inputs.plan).crate == ''
        shell: bash
        run: |
          set -euo pipefail
          uv build --project "$PACKAGE" --out-dir "$GITHUB_WORKSPACE/dist"
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            uv run --isolated --no-project --directory "$RUNNER_TEMP" --with "$wheel" \
              python -c 'import importlib, sys; importlib.import_module(sys.argv[1])' "$IMPORT_NAME"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: dist-${{ inputs.package }}-${{ matrix.runner }}-${{ matrix.abi }}
          path: dist
          if-no-files-found: error
