name: Test & Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    outputs:
      rust-toolchain:
        description: The package-selected Rust toolchain channel
        value: ${{ jobs.resolve.outputs.rust-toolchain }}

permissions:
  actions: write
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build-runners: ${{ steps.resolve.outputs.build-runners }}
      import-name: ${{ steps.resolve.outputs.import-name }}
      is-release: ${{ steps.resolve.outputs.is-release }}
      is-rusty: ${{ steps.resolve.outputs.is-rusty }}
      pypy: ${{ steps.resolve.outputs.pypy }}
      rust-toolchain: ${{ steps.resolve.outputs.rust-toolchain }}
      test-matrix: ${{ steps.resolve.outputs.test-matrix }}
      type: ${{ steps.resolve.outputs.type }}
      rust-test-runners: ${{ steps.resolve.outputs.rust-test-runners }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/matrix.py "$PACKAGE"

  source:
    needs: resolve
    if: inputs.package == 'gometry'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}-source
          cache-on-failure: false
          cache-save-if: false
          rustflags: ""

      - name: Install cargo-about
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install Maturin
        shell: bash
        run: |
          set -euo pipefail
          uv tool run --from maturin==1.14.1 maturin --version

      - name: Stage source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gometry-source"
          python3 gometry/tools/wheel_smoke.py \
            --stage-sdist "$RUNNER_TEMP/gometry-source"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gometry-source
          path: ${{ runner.temp }}/gometry-source
          if-no-files-found: error

  test-rust:
    needs: resolve
    if: needs.resolve.outputs.is-rusty == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.resolve.outputs.rust-test-runners) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Empty: preserve the .cargo/config.toml x86-64-v2 development baseline.
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: nextest

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: needs.resolve.outputs.type != 'rust'
        with:
          enable-cache: false

      # Rust tests that touch the Python boundary run an embedded interpreter,
      # which does not inherit a launcher-configured module search path -- the
      # package's own runtime dependencies have to be handed to it explicitly.
      # No `python-version` above and no PYO3_PYTHON here: pyo3 links whatever
      # `python3` the runner provides, and installing for that same interpreter
      # is what keeps the wheel ABI matching. Installing for a different one
      # fails as an *incompatible* extension module rather than a missing
      # package, which reads nothing like the real cause.
      - name: Install embedded interpreter dependencies
        if: needs.resolve.outputs.type != 'rust'
        shell: bash
        run: |
          set -euo pipefail
          python="$(command -v python3)"
          echo "embedded interpreter: $python ($("$python" -V))"
          cd "$PACKAGE"
          uv export --no-dev --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/embedded-requirements.txt"
          uv pip install --python "$python" --target "$RUNNER_TEMP/embedded-deps" \
            -r "$RUNNER_TEMP/embedded-requirements.txt"
          echo "PYTHONPATH=$RUNNER_TEMP/embedded-deps" >> "$GITHUB_ENV"

      # Rust behavior tests only; source-quality checks run through tools/check.py.
      - name: Test Rust debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "${{ needs.resolve.outputs.type }}" = rust ]; then
            cargo nextest run --locked -p "$PACKAGE"
          else
            cargo nextest run --no-tests pass
          fi

      - name: Test Rust release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "${{ needs.resolve.outputs.type }}" = rust ]; then
            cargo nextest run --locked -p "$PACKAGE" --release
            cargo clippy --locked -p "$PACKAGE" --all-targets -- -D warnings
          else
            cargo nextest run --no-tests pass --release
          fi

  test:
    needs: resolve
    if: needs.resolve.outputs.type != 'rust'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ inputs.package }}
      FREETHREADED: ${{ matrix.freethreaded }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && matrix.primary == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          cache-suffix: ${{ env.PACKAGE }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: >-
            ${{ github.ref == 'refs/heads/main'
                && (matrix.primary == 'true' || runner.os != 'Linux') }}
          rustflags: ""

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Package before-test hook
        if: hashFiles(format('{0}/tools/ci_before_test.sh', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          bash "$PACKAGE/tools/ci_before_test.sh"

      - name: Test Python
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          # The free-threaded cell is also the debug arm. `dev` turns on
          # debug_assertions and overflow-checks, which release omits and which
          # nothing else in CI exercises -- every other cell builds release via
          # maturin's PEP 517 default, which is what publishes. Free-threaded is
          # where a latent race is likeliest to trip an assertion.
          if [ "$FREETHREADED" = "true" ]; then
            export MATURIN_PEP517_ARGS="--profile dev"
            export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} -n 0"
          fi
          uv sync ${{ matrix.uv-sync-args }} --python "${{ matrix.python-version }}"
          if [ "$FREETHREADED" = "true" ]; then
            uv run --python "${{ matrix.python-version }}" python -c \
              'import importlib, sys; importlib.import_module("${{ needs.resolve.outputs.import-name }}"); assert not sys._is_gil_enabled()'
          fi
          uv run --python "${{ matrix.python-version }}" python -m pytest tests

      - name: Show compiler cache statistics
        if: always() && needs.resolve.outputs.is-rusty == 'true' && env.SCCACHE_GHA_RW_MODE == 'READ_WRITE'
        shell: bash
        run: |
          "$SCCACHE_PATH" --show-stats

      - name: Check package quality
        if: matrix.primary == 'true' && hashFiles(format('{0}/tools/check.py', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          uv run --python "${{ matrix.python-version }}" --with 'pyright>=1.1.411' \
            python tools/check.py

  build:
    needs: [resolve, source]
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.type != 'rust'
      && (inputs.package != 'gometry' || needs.source.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.resolve.outputs.build-runners) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ inputs.package }}
      CIBUILDWHEEL_VERSION: "4.1.0"
      # Native arch only — avoids win32 from auto on windows-latest; pairs with
      # windows-11-arm for ARM64 wheels.
      CIBW_ARCHS: native
      CIBW_BUILD_FRONTEND: build[uv]
      CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0"
      CIBW_ENVIRONMENT_PASS_LINUX: ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN MATURIN_PEP517_ARGS RUSTUP_TOOLCHAIN SCCACHE_GHA_ENABLED SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH
      CIBW_TEST_COMMAND: >-
        ${{ inputs.package == 'gometry'
            && 'python "{project}/tools/wheel_smoke.py" --installed'
            || format('python -c "import {0}"', needs.resolve.outputs.import-name) }}
      # Wheels built here are what publish. x86_64 targets use x86-64-v2;
      # arm64 keeps its native target. maturin's PEP 517 default is `--release`,
      # which is now the fast local profile (thin LTO, unstripped) — publishing that
      # would ship a ~5x larger artifact. `release-dist` is the published configuration:
      # fat LTO, one codegen unit, DWARF dropped, symbol table kept for named frames.
      MATURIN_PEP517_ARGS: >-
        ${{ inputs.package == 'gometry'
            && '--locked --profile release-dist'
            || '--profile release-dist' }}
      RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust-toolchain }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      CIBW_BEFORE_ALL_LINUX:
        'set -eu; if command -v dnf >/dev/null; then dnf install -y sqlite; else apk add --no-cache sqlite; fi;
        curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup-init.sh;
        sh rustup-init.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Download staged gometry source
        if: inputs.package == 'gometry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gometry-source
          path: source

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          enable-cache: true
          cache-suffix: ${{ env.PACKAGE }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: ${{ runner.os != 'Linux' }}
          rustflags: ""

      - name: Rewrite README for PyPI
        if: inputs.package != 'gometry'
        shell: bash
        run: python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "${{ github.ref_name }}"

      - name: Verify staged gometry source
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(source/gometry-*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected exactly one staged gometry sdist" >&2
            exit 1
          fi
          python3 gometry/tools/wheel_smoke.py \
            --verify-source "${sdists[0]}" source/gometry-source-manifest.json

      - name: Export staged gometry source identity
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          python3 - source/gometry-source-manifest.json >> "$GITHUB_ENV" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as stream:
              manifest = json.load(stream)
          source = manifest["sdist"]
          for key, value in {
              "GOMETRY_SMOKE_EXPECTED_VERSION": source["version"],
              "GOMETRY_SMOKE_EXPECTED_SOURCE_INPUTS_SHA256": manifest["source_inputs_sha256"],
              "GOMETRY_SMOKE_EXPECTED_NATIVE_SOURCE_INPUTS_SHA256": manifest["native_source_inputs_sha256"],
          }.items():
              print(f"{key}={value}")
          PY

      - name: Configure gometry x86-64-v2 release target
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) target=x86_64-unknown-linux-gnu ;;
            Linux:ARM64) target=aarch64-unknown-linux-gnu ;;
            macOS:X64) target=x86_64-apple-darwin ;;
            macOS:ARM64) target=aarch64-apple-darwin ;;
            Windows:X64) target=x86_64-pc-windows-msvc ;;
            Windows:ARM64) target=aarch64-pc-windows-msvc ;;
            *) echo "unsupported gometry release runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          python3 - "$target" "$RUNNER_OS" >> "$GITHUB_ENV" <<'PY'
          import os
          import shlex
          import sys
          sys.path.insert(0, "gometry/tools")
          import wheel_smoke

          target, runner_os = sys.argv[1:]
          policy = wheel_smoke.release_target_policy(target)
          flags = {
              "RUSTFLAGS": wheel_smoke._flag_text(policy["rustflags"]),
              "CFLAGS": wheel_smoke._flag_text(policy["cflags"]),
              "CXXFLAGS": wheel_smoke._flag_text(policy["cxxflags"]),
          }
          for key, value in {
              "GOMETRY_RELEASE_TARGET": policy["target"],
              "GOMETRY_RELEASE_TARGET_POLICY": policy["target_policy"],
              "GOMETRY_RELEASE_RUSTFLAGS": flags["RUSTFLAGS"],
              "GOMETRY_RELEASE_CFLAGS": flags["CFLAGS"],
              "GOMETRY_RELEASE_CXXFLAGS": flags["CXXFLAGS"],
              "GOMETRY_SMOKE_EXPECTED_TARGET": policy["target"],
              "GOMETRY_SMOKE_EXPECTED_ARCHITECTURE": policy["architecture"],
          }.items():
              print(f"{key}={value}")

          assignments = [
              f"{key}={shlex.quote(value)}"
              for key, value in {
                  "RUSTFLAGS": flags["RUSTFLAGS"],
                  f"CFLAGS_{target.replace('-', '_')}": flags["CFLAGS"],
                  f"CXXFLAGS_{target.replace('-', '_')}": flags["CXXFLAGS"],
                  "CPPFLAGS": "",
                  "TARGET_CFLAGS": "",
                  "TARGET_CXXFLAGS": "",
                  "HOST_CFLAGS": "",
                  "HOST_CXXFLAGS": "",
                  "CMAKE_ARGS": "",
                  "GOMETRY_RELEASE_TARGET": policy["target"],
                  "GOMETRY_RELEASE_TARGET_POLICY": policy["target_policy"],
                  "GOMETRY_SMOKE_EXPECTED_VERSION": os.environ["GOMETRY_SMOKE_EXPECTED_VERSION"],
                  "GOMETRY_SMOKE_EXPECTED_SOURCE_INPUTS_SHA256": os.environ["GOMETRY_SMOKE_EXPECTED_SOURCE_INPUTS_SHA256"],
                  "GOMETRY_SMOKE_EXPECTED_NATIVE_SOURCE_INPUTS_SHA256": os.environ["GOMETRY_SMOKE_EXPECTED_NATIVE_SOURCE_INPUTS_SHA256"],
                  "GOMETRY_SMOKE_EXPECTED_TARGET": policy["target"],
                  "GOMETRY_SMOKE_EXPECTED_ARCHITECTURE": policy["architecture"],
              }.items()
          ]
          environment = " ".join(assignments)
          if runner_os == "Linux":
              print(f"GOMETRY_CIBW_RELEASE_ENV={environment}")
          elif runner_os == "macOS":
              print(
                  "CIBW_ENVIRONMENT_MACOS="
                  + 'MACOSX_DEPLOYMENT_TARGET="11.0" '
                  + environment
              )
          else:
              print(f"CIBW_ENVIRONMENT_WINDOWS={environment}")
          PY

      - name: Plan gometry wheels
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(source/gometry-*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected exactly one staged gometry sdist" >&2
            exit 1
          fi
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --print-build-identifiers "${sdists[0]}" \
            > "$RUNNER_TEMP/gometry-identifiers.txt"
          test -s "$RUNNER_TEMP/gometry-identifiers.txt"

      - name: Install cargo-about
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" != Linux ]; then
            exit
          fi

          sccache_dir=$(dirname "$SCCACHE_PATH")
          if [ "$PACKAGE" = gometry ]; then
            test_command='python "{project}/tools/wheel_smoke.py" --installed'
          else
            test_command='python -c "import ${{ needs.resolve.outputs.import-name }}"'
          fi
          if [ "$SCCACHE_GHA_RW_MODE" = READ_WRITE ]; then
            test_command+=" && /opt/sccache/sccache --show-stats"
          fi
          gometry_environment=""
          if [ "$PACKAGE" = gometry ]; then
            gometry_environment=" $GOMETRY_CIBW_RELEASE_ENV"
          fi
          {
            printf '%s\n' "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $sccache_dir:/opt/sccache:ro"
            printf '%s\n' "CIBW_ENVIRONMENT_LINUX=PATH=\"\$HOME/.cargo/bin:\$PATH\" RUSTC_WRAPPER=/opt/sccache/sccache SCCACHE_GHA_RW_MODE=$SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH$gometry_environment"
            printf '%s\n' "CIBW_TEST_COMMAND=$test_command"
          } >> "$GITHUB_ENV"

      - name: Generate license files
        if: needs.resolve.outputs.is-release == 'true' && inputs.package != 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/gen_licenses.py "$PACKAGE"

      - name: Build wheels
        if: needs.resolve.outputs.is-rusty == 'true'
        env:
          # PyPy opt-in only (cibuildwheel 4 default is no pp*). Free-threaded
          # 3.14t wheels need no enable (cpython-freethreading removed in 4.x).
          CIBW_ENABLE: ${{ needs.resolve.outputs.pypy == 'true' && 'pypy' || '' }}
        shell: bash
        run: |
          # Unset empty enable so we do not override tool defaults with "".
          if [ -z "${CIBW_ENABLE}" ]; then
            unset CIBW_ENABLE
          fi
          package_path="$PACKAGE"
          if [ "$PACKAGE" = gometry ]; then
            shopt -s nullglob
            sdists=(source/gometry-*.tar.gz)
            if [ "${#sdists[@]}" -ne 1 ]; then
              echo "expected exactly one staged gometry sdist" >&2
              exit 1
            fi
            package_path="${sdists[0]}"
          fi
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --output-dir dist \
            "$package_path"

      - name: Build package
        if: needs.resolve.outputs.is-rusty == 'false'
        shell: bash
        run: uv build -o dist "$PACKAGE"

      - name: Write gometry wheel receipt
        if: inputs.package == 'gometry'
        env:
          GOMETRY_BUILD_RUNNER: ${{ matrix.runner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 gometry/tools/wheel_smoke.py \
            --write-wheel-receipt \
            dist "$RUNNER_TEMP/gometry-identifiers.txt" source/gometry-source-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.package == 'gometry'
        with:
          name: gometry-wheels-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

      - name: Build sdist
        if: needs.resolve.outputs.is-rusty == 'true' && matrix.runner == 'ubuntu-latest' && inputs.package != 'gometry'
        shell: bash
        run: uv build --sdist -o dist "$PACKAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/') && inputs.package != 'gometry'
        with:
          name: dist-${{ env.PACKAGE }}-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

  aggregate:
    needs: [resolve, source, build]
    if: >-
      always()
      && inputs.package == 'gometry'
      && needs.resolve.result == 'success'
      && needs.source.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: gometry-aggregate
          cache-on-failure: false
          cache-save-if: false
          rustflags: ""

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gometry-source
          path: source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gometry-wheels-*
          path: runners
          merge-multiple: false

      - name: Validate and assemble gometry distributions
        shell: bash
        env:
          EXPECTED_RUNNERS: ${{ needs.resolve.outputs.build-runners }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_RUNNERS" "$RUNNER_TEMP/gometry-runners.json" <<'PY'
          import json
          import sys
          runners = json.loads(sys.argv[1])
          with open(sys.argv[2], 'w', encoding='utf-8') as stream:
              json.dump({'runners': runners}, stream)
          PY
          python3 gometry/tools/wheel_smoke.py \
            --assemble-release dist source runners \
            --expected-runners "$RUNNER_TEMP/gometry-runners.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: gometry-release-distributions
          path: dist
          if-no-files-found: error
