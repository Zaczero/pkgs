name: Validate Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      plan:
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE: ${{ inputs.package }}
  PACKAGE_TYPE: ${{ fromJson(inputs.plan).type }}
  IMPORT_NAME: ${{ fromJson(inputs.plan).import-name }}
  CARGO_PACKAGE: ${{ fromJson(inputs.plan).crate }}
  RUSTUP_TOOLCHAIN: ${{ fromJson(inputs.plan).rust-toolchain }}
  PYTHONDEVMODE: "1"

jobs:
  rust:
    if: fromJson(inputs.plan).type == 'rust'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.plan).rust-test-runners }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ fromJson(inputs.plan).submodules }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-targets: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/compiler-cache # zizmor: ignore[self-repository] -- actionlint does not yet accept $/ syntax

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Package prerequisites
        shell: bash
        run: |
          for hook in before_build before_test; do
            if [ -f "$PACKAGE/tools/ci_$hook.sh" ]; then
              bash "$PACKAGE/tools/ci_$hook.sh"
            fi
          done

      - name: Test Rust debug and release
        shell: bash
        run: bash .github/scripts/test_rust.sh

  development:
    name: Development
    if: fromJson(inputs.plan).type == 'python-rust'
    runs-on: ubuntu-26.04
    env:
      MATURIN_PEP517_ARGS: --profile dev --locked --compression-method stored

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ fromJson(inputs.plan).submodules }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}
          check-latest: true

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ inputs.package }}
          python-version: ${{ steps.python.outputs.python-path }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-targets: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/compiler-cache # zizmor: ignore[self-repository] -- actionlint does not yet accept $/ syntax

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Package prerequisites
        shell: bash
        run: |
          for hook in before_build before_test; do
            if [ -f "$PACKAGE/tools/ci_$hook.sh" ]; then
              bash "$PACKAGE/tools/ci_$hook.sh"
            fi
          done

      - name: Test development extension
        shell: bash
        run: |
          uv sync --project "$PACKAGE" --no-default-groups --group dev --no-install-project
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          uv build --python "$python" --wheel --out-dir "$RUNNER_TEMP/development-wheel" "$PACKAGE"
          uv run --project "$PACKAGE" --no-sync python .github/scripts/install_wheel.py "$PACKAGE" "$RUNNER_TEMP/development-wheel"
          bash .github/scripts/test_python.sh

      - name: Test embedded Rust against the Python test installation
        shell: bash
        run: |
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          PYO3_PYTHON="$python"
          PYTHONPATH="$("$python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          PATH="$(dirname "$python"):$PATH"
          export PYO3_PYTHON PYTHONPATH PATH
          bash .github/scripts/test_rust.sh

  test-address-sanitizer:
    name: ASan
    if: fromJson(inputs.plan).crate != ''
    runs-on: ubuntu-26.04
    env:
      PYTHONMALLOC: malloc
      # Embedded CPython retains process-lifetime allocations after tests finish.
      ASAN_OPTIONS: ${{ fromJson(inputs.plan).type == 'rust' && 'detect_leaks=1' || 'detect_leaks=0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ fromJson(inputs.plan).submodules }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}
          check-latest: true

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: fromJson(inputs.plan).type != 'rust'
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          working-directory: ${{ inputs.package }}
          python-version: ${{ steps.python.outputs.python-path }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          components: rust-src
          cache-key: ${{ inputs.package }}-address-sanitizer
          cache-targets: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/compiler-cache # zizmor: ignore[self-repository] -- actionlint does not yet accept $/ syntax

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Prepare Clang and AddressSanitizer runtime
        shell: bash
        run: |
          if command -v clang >/dev/null && [ -f "$(clang -print-file-name=libclang_rt.asan-x86_64.so)" ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Package prerequisites
        shell: bash
        run: |
          for hook in before_build before_test; do
            if [ -f "$PACKAGE/tools/ci_$hook.sh" ]; then
              bash "$PACKAGE/tools/ci_$hook.sh"
            fi
          done

      - name: Test instrumented Rust and Python
        shell: bash
        run: bash .github/scripts/test_asan.sh

  prepare-distributions:
    name: Metadata
    if: fromJson(inputs.plan).type != 'rust'
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: fromJson(inputs.plan).crate != ''
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}-licenses
          cache-targets: false
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: fromJson(inputs.plan).crate != ''
        with:
          tool: cargo-about@0.9.2

      - name: Render distribution metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          PUBLISHABLE: ${{ fromJson(inputs.plan).publishable }}
        shell: bash
        run: |
          python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "$REF_NAME"
          if [ "$PUBLISHABLE" = true ]; then
            python3 .github/scripts/gen_licenses.py "$PACKAGE"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-${{ inputs.package }}
          path: |
            ${{ inputs.package }}/README.md
            ${{ inputs.package }}/LICENSE*.md
          if-no-files-found: error
          retention-days: 1

  wheels:
    needs: prepare-distributions
    if: fromJson(inputs.plan).type != 'rust'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.plan).build-targets }}
    uses: ./.github/workflows/_distribution.yaml # zizmor: ignore[self-repository] -- same-revision workflow
    with:
      package: ${{ inputs.package }}
      plan: ${{ inputs.plan }}
      build: ${{ toJson(fromJson(inputs.plan).builds[matrix.target]) }}
