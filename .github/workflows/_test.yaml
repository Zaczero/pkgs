name: Test & Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    outputs:
      rust-toolchain:
        description: The package-selected Rust toolchain channel
        value: ${{ jobs.resolve.outputs.rust-toolchain }}

permissions:
  actions: write
  contents: read

# CI has no fleet configuration layer; these are the defaults developer
# machines receive from it, so a hung test is cut off and failures carry
# their skip reasons and slowest tests.
env:
  PYTEST_ADDOPTS: -ra --durations=25 --durations-min=0.25
  PYTEST_TIMEOUT: "60"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build-runners: ${{ steps.resolve.outputs.build-runners }}
      import-name: ${{ steps.resolve.outputs.import-name }}
      is-release: ${{ steps.resolve.outputs.is-release }}
      is-rusty: ${{ steps.resolve.outputs.is-rusty }}
      pypy: ${{ steps.resolve.outputs.pypy }}
      rust-toolchain: ${{ steps.resolve.outputs.rust-toolchain }}
      test-matrix: ${{ steps.resolve.outputs.test-matrix }}
      type: ${{ steps.resolve.outputs.type }}
      rust-test-runners: ${{ steps.resolve.outputs.rust-test-runners }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/matrix.py "$PACKAGE"

  source:
    needs: [resolve, test]
    if: inputs.package == 'gometry'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}-source
          cache-on-failure: false
          cache-save-if: false
          rustflags: ""

      - name: Install cargo-about
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install quality build tools
        shell: bash
        run: |
          set -euo pipefail
          cd gometry
          uv sync --group ci --no-install-project --python 3.14

      - name: Stage source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gometry-source"
          cd gometry
          uv run --no-sync --python 3.14 python tools/wheel_smoke.py \
            --stage-sdist "$RUNNER_TEMP/gometry-source"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gometry-source
          path: ${{ runner.temp }}/gometry-source
          if-no-files-found: error

  test-rust:
    needs: resolve
    if: needs.resolve.outputs.is-rusty == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.resolve.outputs.rust-test-runners) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Empty: preserve the .cargo/config.toml x86-64-v2 development baseline.
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: nextest

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: needs.resolve.outputs.type != 'rust'
        with:
          enable-cache: false

      # PyO3, dependency installation and each Nextest run use one selected
      # interpreter. The unit test reports its running ELF identity.
      - name: Install embedded interpreter dependencies
        if: needs.resolve.outputs.type != 'rust'
        shell: bash
        run: |
          set -euo pipefail
          python="$(command -v python3)"
          echo "embedded interpreter: $python ($("$python" -V))"
          cd "$PACKAGE"
          uv export --no-dev --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/embedded-requirements.txt"
          uv pip install --python "$python" --target "$RUNNER_TEMP/embedded-deps" \
            -r "$RUNNER_TEMP/embedded-requirements.txt"
          echo "PYTHONPATH=$RUNNER_TEMP/embedded-deps" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$python" >> "$GITHUB_ENV"
          echo "GOMETRY_EMBEDDED_PYTHON=$python" >> "$GITHUB_ENV"

      # Rust behavior tests only; source-quality checks run through tools/check.py.
      - name: Test Rust debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "$PACKAGE" = gometry ]; then
            run_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
            evidence="$RUNNER_TEMP/gometry-native-debug-$run_id"
            mkdir -p "$evidence"
            cat > "$evidence/nextest.toml" <<EOF
          [profile.default.junit]
          path = "$evidence/junit.xml"
          EOF
            PYO3_PYTHON="$GOMETRY_EMBEDDED_PYTHON" \
              GOMETRY_NATIVE_TEST_RECEIPT="$evidence/binary.json" \
              GOMETRY_NATIVE_TEST_RUN_ID="$run_id" \
              cargo nextest run --locked -p "$PACKAGE" --no-tests fail \
                --no-fail-fast \
                --profile default \
                --tool-config-file "gometry:$evidence/nextest.toml"
            python3 tools/wheel_smoke.py --write-native-test-receipt \
              "$evidence/binary.json" "$evidence/junit.xml" "$evidence/receipt.json" \
              "$GOMETRY_EMBEDDED_PYTHON" --runner "${{ matrix.runner }}" \
              --profile debug --run-id "$run_id"
          elif [ "${{ needs.resolve.outputs.type }}" = rust ]; then
            cargo nextest run --locked -p "$PACKAGE" --no-fail-fast
          else
            cargo nextest run --no-tests pass
          fi

      - name: Test Rust release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "$PACKAGE" = gometry ]; then
            run_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
            evidence="$RUNNER_TEMP/gometry-native-release-$run_id"
            mkdir -p "$evidence"
            cat > "$evidence/nextest.toml" <<EOF
          [profile.default.junit]
          path = "$evidence/junit.xml"
          EOF
            PYO3_PYTHON="$GOMETRY_EMBEDDED_PYTHON" \
              GOMETRY_NATIVE_TEST_RECEIPT="$evidence/binary.json" \
              GOMETRY_NATIVE_TEST_RUN_ID="$run_id" \
              cargo nextest run --locked -p "$PACKAGE" --release \
                --no-tests fail \
                --no-fail-fast \
                --profile default \
                --tool-config-file "gometry:$evidence/nextest.toml"
            python3 tools/wheel_smoke.py --write-native-test-receipt \
              "$evidence/binary.json" "$evidence/junit.xml" "$evidence/receipt.json" \
              "$GOMETRY_EMBEDDED_PYTHON" --runner "${{ matrix.runner }}" \
              --profile release --run-id "$run_id"
          elif [ "${{ needs.resolve.outputs.type }}" = rust ]; then
            cargo nextest run --locked -p "$PACKAGE" --release --no-fail-fast
            cargo clippy --locked -p "$PACKAGE" --all-targets -- -D warnings
          else
            cargo nextest run --no-tests pass --release
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.package == 'gometry'
        with:
          name: gometry-native-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/gometry-native-*
          if-no-files-found: warn

  test:
    needs: resolve
    if: needs.resolve.outputs.type != 'rust'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ inputs.package }}
      FREETHREADED: ${{ matrix.freethreaded }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && matrix.primary == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          cache-suffix: ${{ env.PACKAGE }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: >-
            ${{ github.ref == 'refs/heads/main'
                && (matrix.primary == 'true' || runner.os != 'Linux') }}
          rustflags: ""

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Install Gometry license generator
        if: inputs.package == 'gometry'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Package before-test hook
        if: hashFiles(format('{0}/tools/ci_before_test.sh', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          bash "$PACKAGE/tools/ci_before_test.sh"

      - name: Test Python
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          # The free-threaded cell is also the debug arm. `dev` turns on
          # debug_assertions and overflow-checks, which release omits and which
          # nothing else in CI exercises -- every other cell builds release via
          # maturin's PEP 517 default, which is what publishes. Free-threaded is
          # where a latent race is likeliest to trip an assertion.
          if [ "$FREETHREADED" = "true" ]; then
            export MATURIN_PEP517_ARGS="--profile dev"
            export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} -n 0"
          fi
          if [ "$PACKAGE" = gometry ]; then
            uv sync --group ci --no-install-project --python "${{ matrix.python-version }}"
            uv run --no-sync --python "${{ matrix.python-version }}" python -c '
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import quality_runtime
          quality_runtime.prepare_quality_runtime(
              Path.cwd(),
              scratch=Path("target/quality-runtime"),
          )
          '
            runtime_root="$(uv run --no-sync --python "${{ matrix.python-version }}" python -c '
          import json
          from pathlib import Path
          receipt = json.loads(Path("target/quality-runtime/receipt.json").read_text())
          print(receipt["package_root"])
          ')"
            export PYTHONPATH="$runtime_root${PYTHONPATH:+:$PYTHONPATH}"
            if [ "$FREETHREADED" = "true" ]; then
              uv run --no-sync --python "${{ matrix.python-version }}" python -c \
                'import sys; assert not sys._is_gil_enabled()'
            fi
            uv run --no-sync --python "${{ matrix.python-version }}" python -m pytest tests
          else
            uv sync ${{ matrix.uv-sync-args }} --python "${{ matrix.python-version }}"
            if [ "$FREETHREADED" = "true" ]; then
              uv run --python "${{ matrix.python-version }}" python -c \
                'import importlib, sys; importlib.import_module("${{ needs.resolve.outputs.import-name }}"); assert not sys._is_gil_enabled()'
            fi
            uv run --python "${{ matrix.python-version }}" python -m pytest tests
          fi

      - name: Show compiler cache statistics
        if: always() && needs.resolve.outputs.is-rusty == 'true' && env.SCCACHE_GHA_RW_MODE == 'READ_WRITE'
        shell: bash
        run: |
          "$SCCACHE_PATH" --show-stats

      - name: Check package quality
        if: matrix.primary == 'true' && hashFiles(format('{0}/tools/check.py', inputs.package)) != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "$PACKAGE" = gometry ]; then
            runtime_root="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("target/quality-runtime/receipt.json").read_text())["package_root"])')"
            PYTHONPATH="$runtime_root${PYTHONPATH:+:$PYTHONPATH}" \
              uv run --no-sync --python "${{ matrix.python-version }}" --with 'pyright>=1.1.411' \
              python tools/check.py --no-fix
          else
            uv run --python "${{ matrix.python-version }}" --with 'pyright>=1.1.411' \
              python tools/check.py --no-fix
          fi

  build:
    needs: [resolve, source]
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.type != 'rust'
      && (inputs.package != 'gometry' || needs.source.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.resolve.outputs.build-runners) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ inputs.package }}
      CIBUILDWHEEL_VERSION: "4.1.0"
      # Native arch only — avoids win32 from auto on windows-latest; pairs with
      # windows-11-arm for ARM64 wheels.
      CIBW_ARCHS: native
      RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust-toolchain }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      CIBW_BEFORE_ALL_LINUX:
        'set -eu; if command -v dnf >/dev/null; then dnf install -y sqlite; else apk add --no-cache sqlite; fi;
        curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup-init.sh;
        sh rustup-init.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Download staged gometry source
        if: inputs.package == 'gometry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gometry-source
          path: source

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: |
            pyproject.toml
            native/**
          enable-cache: true
          cache-suffix: ${{ env.PACKAGE }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ env.PACKAGE }}

      - name: Install SQLite command-line shell
        if: inputs.package == 'gometry' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install_sqlite.ps1

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: ${{ env.PACKAGE }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: ${{ runner.os != 'Linux' }}
          rustflags: ""

      - name: Rewrite README for PyPI
        if: inputs.package != 'gometry'
        shell: bash
        run: python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "${{ github.ref_name }}"

      - name: Prepare extracted gometry source and test context
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(source/gometry-*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected exactly one staged gometry sdist" >&2
            exit 1
          fi
          python3 - "${sdists[0]}" source/gometry-source-manifest.json \
            "$RUNNER_TEMP/gometry-cibw-context" >> "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "gometry/tools")
          import release_artifact
          sdist, manifest, project_root = (Path(arg) for arg in sys.argv[1:])
          package_dir = release_artifact.prepare_cibw_project(
              sdist,
              manifest,
              project_root,
          )
          print(f"GOMETRY_CIBW_PROJECT_ROOT={package_dir}")
          print(f"GOMETRY_CIBW_PACKAGE_DIR={package_dir}")
          PY

      - name: Plan gometry wheels
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --print-build-identifiers "$GOMETRY_CIBW_PACKAGE_DIR" \
            > "$RUNNER_TEMP/gometry-identifiers.txt"
          test -s "$RUNNER_TEMP/gometry-identifiers.txt"

      - name: Install cargo-about
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-about@0.8.4

      - name: Install sccache
        if: needs.resolve.outputs.is-rusty == 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: needs.resolve.outputs.is-rusty == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          if [ "$PACKAGE" = gometry ]; then
            evidence_dir="$RUNNER_TEMP/gometry-evidence/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            config_path="$RUNNER_TEMP/gometry-cibw.toml"
            build_log="$evidence_dir/build.log"
            output_dir="$GITHUB_WORKSPACE/dist"
            package_dir="$GOMETRY_CIBW_PACKAGE_DIR"
            python3 - "$RUNNER_TEMP/gometry-identifiers.txt" \
              source/gometry-source-manifest.json "$evidence_dir" "$config_path" \
              "$GOMETRY_CIBW_PROJECT_ROOT" "$package_dir" "$output_dir" \
              "$RUNNER_TEMP" "${{ matrix.runner }}" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "gometry/tools")
          import release_artifact

          (
              identifiers,
              source_manifest,
              evidence_dir,
              config_path,
              project_root,
              package_dir,
              output_dir,
              runner_temp,
              runner,
              github_env,
          ) = sys.argv[1:]
          command = [
              "uv",
              "tool",
              "run",
              "--from",
              f"cibuildwheel=={release_artifact.CIBUILDWHEEL_VERSION}",
              "cibuildwheel",
              "--output-dir",
              output_dir,
              "--config-file",
              config_path,
              package_dir,
          ]
          release_artifact.prepare_cibw_evidence(
              Path(identifiers),
              Path(source_manifest),
              Path(evidence_dir),
              Path(config_path),
              runner=runner,
              project_root=Path(project_root),
              package_dir=Path(package_dir),
              cibw_argv=command,
          )
          with Path(github_env).open("a", encoding="utf-8") as stream:
              for key, value in {
                  "GOMETRY_CIBW_EVIDENCE": evidence_dir,
                  "GOMETRY_CIBW_CONFIG": config_path,
                  "GOMETRY_CIBW_BUILD_LOG": f"{evidence_dir}/build.log",
                  "GOMETRY_CIBW_ARGV_JSON": json.dumps(command, separators=(",", ":")),
                  "GOMETRY_BUILD_RUNNER": runner,
                  "GOMETRY_CIBW_OUTPUT": output_dir,
              }.items():
                  stream.write(f"{key}={value}\n")
          PY
            if [ "$RUNNER_OS" = Linux ]; then
              sccache_dir=$(dirname "$SCCACHE_PATH")
              {
                printf '%s\n' \
                  "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $sccache_dir:/opt/sccache:ro --volume $evidence_dir:/gometry-evidence"
              } >> "$GITHUB_ENV"
            fi
          else
            test_command='python -c "import ${{ needs.resolve.outputs.import-name }}"'
            if [ "$RUNNER_OS" = Linux ] && [ "$SCCACHE_GHA_RW_MODE" = READ_WRITE ]; then
              test_command+=" && /opt/sccache/sccache --show-stats"
            fi
            {
              printf '%s\n' 'CIBW_BUILD_FRONTEND=build[uv]'
              printf '%s\n' 'MATURIN_PEP517_ARGS=--profile release-dist'
              printf '%s\n' \
                'CIBW_ENVIRONMENT_LINUX=PATH="$HOME/.cargo/bin:$PATH" RUSTC_WRAPPER=/opt/sccache/sccache SCCACHE_GHA_RW_MODE=$SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH'
              printf '%s\n' 'CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET="11.0"'
              printf '%s\n' \
                'CIBW_ENVIRONMENT_PASS_LINUX=ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN MATURIN_PEP517_ARGS RUSTUP_TOOLCHAIN SCCACHE_GHA_ENABLED SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH'
              printf '%s\n' "CIBW_TEST_COMMAND=$test_command"
            } >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = Linux ]; then
              sccache_dir=$(dirname "$SCCACHE_PATH")
              printf '%s\n' \
                "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $sccache_dir:/opt/sccache:ro" \
                >> "$GITHUB_ENV"
            fi
          fi

      - name: Confirm generated gometry CIBW plan
        if: inputs.package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOMETRY_CIBW_PROJECT_ROOT"
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --config-file "$GOMETRY_CIBW_CONFIG" \
            --print-build-identifiers "$GOMETRY_CIBW_PACKAGE_DIR" \
            > "$RUNNER_TEMP/gometry-identifiers-final.txt"
          cmp "$RUNNER_TEMP/gometry-identifiers.txt" \
            "$RUNNER_TEMP/gometry-identifiers-final.txt"
          echo "GOMETRY_CIBW_IDENTIFIERS=$RUNNER_TEMP/gometry-identifiers-final.txt" \
            >> "$GITHUB_ENV"

      - name: Generate license files
        if: needs.resolve.outputs.is-release == 'true' && inputs.package != 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/gen_licenses.py "$PACKAGE"

      - name: Build wheels
        if: needs.resolve.outputs.is-rusty == 'true'
        env:
          GOMETRY_BUILD_RUNNER: ${{ matrix.runner }}
          # PyPy opt-in only (cibuildwheel 4 default is no pp*). Free-threaded
          # 3.14t wheels need no enable (cpython-freethreading removed in 4.x).
          CIBW_ENABLE: ${{ needs.resolve.outputs.pypy == 'true' && 'pypy' || '' }}
        shell: bash
        run: |
          # Unset empty enable so we do not override tool defaults with "".
          if [ -z "${CIBW_ENABLE}" ]; then
            unset CIBW_ENABLE
          fi
          if [ "$PACKAGE" = gometry ]; then
            rm -rf "$GOMETRY_CIBW_OUTPUT"
            mkdir -p "$GOMETRY_CIBW_OUTPUT"
            printf 'cibuildwheel dispatch: %s\n' "$GOMETRY_CIBW_ARGV_JSON" \
              > "$GOMETRY_CIBW_BUILD_LOG"
            cd "$GOMETRY_CIBW_PROJECT_ROOT"
            set +e
            python3 -c '
          import json
          import os
          arguments = json.loads(os.environ["GOMETRY_CIBW_ARGV_JSON"])
          os.execvp(arguments[0], arguments)
          ' 2>&1 | tee -a "$GOMETRY_CIBW_BUILD_LOG"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            cibw_status="${pipeline_status[0]}"
            capture_status="${pipeline_status[1]}"
            set +e
            cd "$GITHUB_WORKSPACE"
            python3 gometry/tools/wheel_smoke.py \
              --write-wheel-receipt \
              "$GOMETRY_CIBW_OUTPUT" "$GOMETRY_CIBW_IDENTIFIERS" \
              source/gometry-source-manifest.json \
              --evidence-dir "$GOMETRY_CIBW_EVIDENCE" \
              --build-log "$GOMETRY_CIBW_BUILD_LOG" \
              --build-exit-code "$cibw_status" \
              --capture-exit-code "$capture_status"
            receipt_status=$?
            set -e
            if [ "$cibw_status" -ne 0 ]; then
              exit "$cibw_status"
            fi
            if [ "$capture_status" -ne 0 ]; then
              exit "$capture_status"
            fi
            exit "$receipt_status"
          fi
          uv tool run \
            --from "cibuildwheel==$CIBUILDWHEEL_VERSION" cibuildwheel \
            --output-dir dist \
            "$PACKAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && inputs.package == 'gometry'
        with:
          name: gometry-build-evidence-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/gometry-evidence/**/build.log
            ${{ runner.temp }}/gometry-evidence/**/wheel-item.json
          if-no-files-found: warn

      - name: Build package
        if: needs.resolve.outputs.is-rusty == 'false'
        shell: bash
        run: uv build -o dist "$PACKAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.package == 'gometry'
        with:
          name: gometry-wheels-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

      - name: Build sdist
        if: needs.resolve.outputs.is-rusty == 'true' && matrix.runner == 'ubuntu-latest' && inputs.package != 'gometry'
        shell: bash
        run: uv build --sdist -o dist "$PACKAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/') && inputs.package != 'gometry'
        with:
          name: dist-${{ env.PACKAGE }}-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

  aggregate:
    needs: [resolve, source, build]
    if: >-
      always()
      && inputs.package == 'gometry'
      && needs.resolve.result == 'success'
      && needs.source.result == 'success'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ needs.resolve.outputs.rust-toolchain }}
          cache-key: gometry-aggregate
          cache-on-failure: false
          cache-save-if: false
          rustflags: ""

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gometry-source
          path: source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gometry-wheels-*
          path: runners
          merge-multiple: false

      - name: Validate and assemble gometry distributions
        shell: bash
        env:
          EXPECTED_RUNNERS: ${{ needs.resolve.outputs.build-runners }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_RUNNERS" "$RUNNER_TEMP/gometry-runners.json" <<'PY'
          import json
          import sys
          runners = json.loads(sys.argv[1])
          with open(sys.argv[2], 'w', encoding='utf-8') as stream:
              json.dump({'runners': runners}, stream)
          PY
          python3 gometry/tools/wheel_smoke.py \
            --assemble-release dist source runners \
            --expected-runners "$RUNNER_TEMP/gometry-runners.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: gometry-release-distributions
          path: dist
          if-no-files-found: error
