name: Test & Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      plan:
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE: ${{ inputs.package }}
  IMPORT_NAME: ${{ fromJson(inputs.plan).import-name }}
  CARGO_PACKAGE: ${{ fromJson(inputs.plan).crate }}
  PYTHONDEVMODE: "1"

jobs:
  test-rust:
    if: fromJson(inputs.plan).is-rusty == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.plan).rust-test-runners }}
    runs-on: ${{ matrix.runner }}
    env:
      MATURIN_PEP517_ARGS: --profile dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          working-directory: ${{ inputs.package }}
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Prepare embedded Python
        if: fromJson(inputs.plan).type != 'rust'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project "$PACKAGE" --no-dev
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          {
            echo "PYO3_PYTHON=$python"
            echo "PYTHONPATH=$("$python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          } >> "$GITHUB_ENV"
          dirname "$python" >> "$GITHUB_PATH"

      - name: Test Rust debug
        shell: bash
        run: cargo nextest run --locked -p "$CARGO_PACKAGE"

      - name: Test Rust release
        shell: bash
        run: cargo nextest run --locked -p "$CARGO_PACKAGE" --release

  test-address-sanitizer:
    if: fromJson(inputs.plan).is-rusty == 'true'
    runs-on: ubuntu-26.04
    env:
      MATURIN_PEP517_ARGS: --profile dev
      PYTHONMALLOC: malloc
      # Embedded CPython retains process-lifetime allocations after tests finish.
      ASAN_OPTIONS: ${{ fromJson(inputs.plan).type == 'rust' && 'detect_leaks=1' || 'detect_leaks=0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          working-directory: ${{ inputs.package }}
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          components: rust-src
          cache-key: ${{ inputs.package }}-address-sanitizer
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Prepare embedded Python
        if: fromJson(inputs.plan).type != 'rust'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project "$PACKAGE" --no-dev
          python="$(uv run --project "$PACKAGE" --no-sync python -c 'import sys; print(sys.executable)')"
          {
            echo "PYO3_PYTHON=$python"
            echo "PYTHONPATH=$("$python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          } >> "$GITHUB_ENV"
          dirname "$python" >> "$GITHUB_PATH"

      - name: Test instrumented Rust and standard library
        shell: bash
        run: |
          cargo nextest run --locked -p "$CARGO_PACKAGE" \
            --target x86_64-unknown-linux-gnu -Z build-std \
            --config 'target.x86_64-unknown-linux-gnu.rustflags=["-Zsanitizer=address"]'

  test-miri:
    if: fromJson(inputs.plan).is-rusty == 'true'
    runs-on: ubuntu-26.04
    env:
      # File-backed tests use uniquely owned host fixtures.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: fromJson(inputs.plan).type != 'rust'
        with:
          python-version: ${{ fromJson(inputs.plan).primary-python }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          components: miri, rust-src
          cache-key: ${{ inputs.package }}-miri
          cache-directories: ~/.cache/miri
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Interpret Rust tests
        shell: bash
        run: |
          set -euo pipefail
          PYO3_PYTHON="$(command -v python3)"
          export PYO3_PYTHON
          cargo miri nextest run --locked -p "$CARGO_PACKAGE" \
            --profile default-miri

  test:
    if: fromJson(inputs.plan).type != 'rust'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.plan).test-matrix }}
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: ${{ inputs.package }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: ${{ inputs.package }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' && matrix.primary == 'true' }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          version: v0.17.0

      - name: Configure compiler cache
        if: fromJson(inputs.plan).is-rusty == 'true'
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      - name: Package before-test hook
        if: hashFiles(format('{0}/tools/ci_before_test.sh', inputs.package)) != ''
        shell: bash
        run: bash "$PACKAGE/tools/ci_before_test.sh"

      - name: Test Python
        env:
          DEPENDENCY_GROUP: ${{ matrix.dependency-group }}
          FREETHREADED: ${{ matrix.freethreaded }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          if [ "$FREETHREADED" = true ]; then
            export MATURIN_PEP517_ARGS="--profile dev"
            export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} -n 0"
          fi
          uv sync --no-default-groups --group "$DEPENDENCY_GROUP"
          uv run --no-sync python - "$IMPORT_NAME" <<'PY'
          import importlib
          import sys
          import sysconfig
          importlib.import_module(sys.argv[1])
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert not sys._is_gil_enabled()
          PY
          uv run --no-sync python -m pytest tests \
            --ignore=tests/tooling --ignore=tests/test_public_docs.py

      - name: Check Python types
        if: matrix.os == 'ubuntu-26.04' && matrix.python-version == fromJson(inputs.plan).python-versions[0]
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE"
          python="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          uv tool run pyright --pythonpath "$python"

      - name: Audit Python dependencies
        if: matrix.primary == 'true'
        shell: bash
        run: uv audit --project "$PACKAGE" --locked

  build:
    if: fromJson(inputs.plan).type != 'rust'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.plan).build-matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJson(inputs.plan).rust-toolchain }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.package }}
          save-cache: false
          python-version: ${{ fromJson(inputs.plan).primary-python }}
          working-directory: ${{ inputs.package }}

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          toolchain: ${{ fromJson(inputs.plan).rust-toolchain }}
          cache-key: ${{ inputs.package }}
          cache-on-failure: false
          cache-save-if: false
          cache-targets: false

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          tool: cargo-about@0.9.2

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          version: v0.17.0

      - name: Prepare distributions
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_RELEASE: ${{ fromJson(inputs.plan).is-release }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/render_pypi_readme.py "$PACKAGE" "$REF_NAME"
          if [ "$IS_RELEASE" = true ]; then
            python3 .github/scripts/gen_licenses.py "$PACKAGE"
          fi
          if [ -f "$PACKAGE/Cargo.toml" ]; then
            echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = Linux ]; then
              echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume $(dirname "$SCCACHE_PATH"):/opt/sccache:ro" >> "$GITHUB_ENV"
            fi
          fi
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        if: fromJson(inputs.plan).is-rusty == 'true'
        with:
          package-dir: ${{ inputs.package }}
          output-dir: dist
        env:
          CIBW_ARCHS: native
          CIBW_BUILD: ${{ matrix.abi == 'abi3t' && 'cp315t-*' || '*' }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_INHERIT: "test-command; environment-linux; environment-macos"
          CIBW_ENABLE: ${{ fromJson(inputs.plan).pypy == 'true' && 'pypy' || '' }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh &&
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$HOME/.cargo/bin:$PATH" RUSTC_WRAPPER=/opt/sccache/sccache
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0"
          CIBW_ENVIRONMENT_PASS_LINUX: >-
            IMPORT_NAME ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN
            MATURIN_PEP517_ARGS RUSTUP_TOOLCHAIN SCCACHE_GHA_ENABLED SCCACHE_GHA_RW_MODE SOURCE_DATE_EPOCH
          MATURIN_PEP517_ARGS: ${{ matrix.abi == 'abi3t' && '--profile release-dist --features pyo3/abi3t-py315' || '--profile release-dist' }}
          CIBW_TEST_COMMAND: >-
            python -c "import importlib, os; importlib.import_module(os.environ['IMPORT_NAME'])"

      - name: Build source distribution
        if: fromJson(inputs.plan).is-rusty == 'true' && matrix.runner == 'ubuntu-26.04' && matrix.abi == 'optimized'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE/.cargo"
          cp .cargo/config.toml "$PACKAGE/.cargo/config.toml"
          uv build --project "$PACKAGE" --sdist --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Build Python distributions
        if: fromJson(inputs.plan).is-rusty == 'false'
        shell: bash
        run: |
          set -euo pipefail
          uv build --project "$PACKAGE" --out-dir "$GITHUB_WORKSPACE/dist"
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            uv run --isolated --no-project --directory "$RUNNER_TEMP" --with "$wheel" \
              python -c 'import importlib, sys; importlib.import_module(sys.argv[1])' "$IMPORT_NAME"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: dist-${{ inputs.package }}-${{ matrix.runner }}-${{ matrix.abi }}
          path: dist
          if-no-files-found: error
