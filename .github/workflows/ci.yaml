name: CI

on:
  push:
    branches: [main]
    tags: ["*/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      release-package: ${{ steps.release.outputs.package }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BEFORE_SHA: ${{ github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            changed="${tag%/*}"
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              test_all=true
              changed=""
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              base="$BASE_SHA"
              test_all=false
            else
              base="$BEFORE_SHA"
              test_all=false
            fi

            test_packages="$(python3 .github/scripts/package_version.py list --test)"

            if ! $test_all && [[ "$base" =~ ^0+$ ]]; then
              test_all=true
              changed=""
            elif ! $test_all; then
              changed="$(
                git diff --name-only "$base" HEAD |
                  python3 .github/scripts/route_packages.py
              )"
            fi

            if $test_all; then
              changed="$test_packages"
            fi
          fi

          packages="$(
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
            ' <<< "$changed"
          )"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - id: release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          package="${tag%/*}"
          version="${tag#*/}"
          python3 .github/scripts/package_version.py check "$package" "$version"

  test:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    uses: ./.github/workflows/_test.yaml # zizmor: ignore[self-repository] -- actionlint does not yet accept GitHub's $/ workflow syntax
    with:
      package: ${{ matrix.package }}

  release:
    needs: [detect, test]
    if: >-
      startsWith(github.ref, 'refs/tags/')
      && needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.detect.outputs.release-package }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect.outputs.release-package == 'gometry'
        with:
          submodules: true
          persist-credentials: false

      - name: Install gometry Rust toolchain
        if: needs.detect.outputs.release-package == 'gometry'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ needs.test.outputs.rust-toolchain }}
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.detect.outputs.release-package == 'gometry'
        with:
          name: gometry-release-distributions
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.detect.outputs.release-package != 'gometry'
        with:
          pattern: dist-${{ needs.detect.outputs.release-package }}-*
          path: dist
          merge-multiple: true

      - name: Verify gometry release set
        if: needs.detect.outputs.release-package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          python3 gometry/tools/wheel_smoke.py --verify-release dist

      - name: Require non-empty dist
        if: needs.detect.outputs.release-package != 'gometry'
        env:
          PACKAGE: ${{ needs.detect.outputs.release-package }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts under dist/ for $PACKAGE" >&2
            exit 1
          fi
          ls -la dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: needs.detect.outputs.release-package == 'gometry'
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: needs.detect.outputs.release-package != 'gometry'
        with:
          subject-path: dist/*

      - name: Publish distributions
        if: needs.detect.outputs.release-package != 'gometry'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - name: Prepare gometry distributions
        if: needs.detect.outputs.release-package == 'gometry'
        shell: bash
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/

      - name: Publish gometry distributions
        if: needs.detect.outputs.release-package == 'gometry'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish
          skip-existing: true
