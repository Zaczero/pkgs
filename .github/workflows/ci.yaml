name: CI

on:
  push:
    branches: [main]
    tags: ["*/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-26.04

    outputs:
      release-package: ${{ steps.release.outputs.package }}
      plans: ${{ steps.matrix.outputs.plans }}
      rust-checks: ${{ steps.matrix.outputs.rust-checks }}
      kani-checks: ${{ steps.matrix.outputs.kani-checks }}
      primary-python: ${{ steps.matrix.outputs.primary-python }}
      rust-toolchain: ${{ steps.matrix.outputs.rust-toolchain }}
      lint-python: ${{ steps.detect.outputs.lint-python }}
      lint-rust: ${{ steps.detect.outputs.lint-rust }}

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BEFORE_SHA: ${{ github.event.before }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            changed="${tag%/*}"
            test_all=true
            lint_rust=false
            if [[ -f "$changed/Cargo.toml" ]]; then
              lint_rust=true
            fi
          else
            lint_rust=true
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              test_all=true
              changed=""
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              base="$BASE_SHA"
              test_all=false
            else
              base="$BEFORE_SHA"
              test_all=false
            fi

            test_packages="$(PYTHONPATH=.github/scripts python3 -c '
          from package_version import ci_package_sort_key, list_packages
          from route_packages import rust_packages
          print(*sorted(set(list_packages("test")) | rust_packages().keys(),
                        key=ci_package_sort_key), sep="\n")
          ')"

            if ! $test_all && {
              [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null
            }; then
              test_all=true
              changed=""
            elif ! $test_all; then
              selection="$(
                git diff --name-only --no-renames "$base" HEAD |
                  python3 .github/scripts/route_packages.py
              )"
            fi

            if $test_all; then
              changed="$test_packages"
            fi
          fi

          if $test_all; then
            selection="$(jq -R -s -c '
              split("\n") | map(select(length > 0) | {package: .})
            ' <<< "$changed")"
            echo "lint-python=true" >> "$GITHUB_OUTPUT"
            echo "lint-rust=$lint_rust" >> "$GITHUB_OUTPUT"
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.detect.outputs.selection != '[]' || steps.detect.outputs.lint-rust == 'true'
        with:
          enable-cache: false

      - id: matrix
        if: steps.detect.outputs.selection != '[]' || steps.detect.outputs.lint-rust == 'true'
        env:
          SELECTION: ${{ steps.detect.outputs.selection }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/matrix.py <<< "$SELECTION"

      - id: release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          package="${tag%/*}"
          version="${tag#*/}"
          python3 .github/scripts/package_version.py check "$package" "$version"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  lint-python:
    needs: detect
    if: needs.detect.outputs.lint-python == 'true'

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format github

      - run: ruff format --check .

  check-workspace:
    needs: detect
    if: needs.detect.outputs.lint-rust == 'true'

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ needs.detect.outputs.rust-toolchain }}
          components: rustfmt
          cache: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --deny unsound --deny yanked

      - name: Check Rust formatting
        run: cargo fmt --check

  check-rust:
    name: check-rust (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.rust-checks != '' && needs.detect.outputs.rust-checks != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.rust-checks) }}

    runs-on: ubuntu-26.04

    env:
      CARGO_PACKAGE: ${{ matrix.crate }}
      RUSTUP_TOOLCHAIN: ${{ needs.detect.outputs.rust-toolchain }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.detect.outputs.primary-python }}
          check-latest: true

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        # zizmor: ignore[cache-poisoning] -- Checks produce no distribution artifacts.
        with:
          toolchain: ${{ needs.detect.outputs.rust-toolchain }}
          components: clippy
          cache-key: check-${{ matrix.crate }}
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check crate and doctests
        shell: bash
        run: |
          set -euo pipefail
          PYO3_PYTHON="$(command -v python)"
          export PYO3_PYTHON
          cargo clippy --locked -p "$CARGO_PACKAGE" --all-targets
          doctests="$(cargo metadata --locked --no-deps --format-version 1 |
            jq --arg package "$CARGO_PACKAGE" \
              'any(.packages[] | select(.name == $package) | .targets[]; .doctest)')"
          if [[ "$doctests" == true ]]; then
            cargo test --locked -p "$CARGO_PACKAGE" --doc
          fi

  test-kani:
    name: kani (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.kani-checks != '' && needs.detect.outputs.kani-checks != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.kani-checks) }}

    runs-on: ubuntu-26.04

    env:
      KANI_VERSION: "0.68.0"
      CARGO_PACKAGE: ${{ matrix.crate }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.detect.outputs.primary-python }}
          check-latest: true

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        # zizmor: ignore[cache-poisoning] -- Verification produces no distribution artifacts.
        with:
          toolchain: ${{ needs.detect.outputs.rust-toolchain }}
          cache-key: kani-${{ env.KANI_VERSION }}-${{ matrix.crate }}
          cache-directories: ~/.kani
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Kani
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
          # Keep Kani's exact rustc, but use current Cargo for workspace manifest features.
          cp --remove-destination "$(rustup which cargo)" "$HOME/.kani/kani-$KANI_VERSION/toolchain/bin/cargo"

      - name: Verify first-party Rust harnesses
        shell: bash
        run: |
          set -euo pipefail
          PYO3_PYTHON="$(command -v python)"
          export PYO3_PYTHON
          cargo kani -p "$CARGO_PACKAGE" --lib --bins -j -Z unstable-options \
            --harness-timeout 180 --output-format terse

  test:
    name: ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.plans != '' && needs.detect.outputs.plans != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.plans) }}

    uses: ./.github/workflows/_test.yaml # zizmor: ignore[self-repository] -- actionlint does not yet accept GitHub's $/ workflow syntax
    with:
      package: ${{ matrix.package }}
      plan: ${{ toJson(matrix.plan) }}

  release:
    needs: [detect, test, lint-python, check-workspace, check-rust, test-kani]
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.test.result == 'success'
      && needs.lint-python.result == 'success'
      && (
        (needs.detect.outputs.lint-rust == 'true'
          && needs.check-workspace.result == 'success'
          && needs.check-rust.result == 'success'
          && (
            needs.test-kani.result == 'success'
            || (needs.detect.outputs.kani-checks == '[]' && needs.test-kani.result == 'skipped')))
        || (needs.detect.outputs.lint-rust == 'false'
          && needs.check-workspace.result == 'skipped'
          && needs.check-rust.result == 'skipped'
          && needs.test-kani.result == 'skipped')
      )

    runs-on: ubuntu-26.04

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.detect.outputs.release-package }}

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-${{ needs.detect.outputs.release-package }}-*
          path: dist
          merge-multiple: true

      - name: Require non-empty dist
        env:
          PACKAGE: ${{ needs.detect.outputs.release-package }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts under dist/ for $PACKAGE" >&2
            exit 1
          fi
          ls -la dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
