name: Wheel build tools
description: Share cibuildwheel interpreter and tool downloads across packages

inputs:
  save:
    description: Own this runner platform's cache publication
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      with:
        path: ${{ runner.temp }}/cibuildwheel-cache
        key: wheel-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-versions', '**/pyproject.toml', '.github/workflows/_distribution.yaml') }}
        restore-keys: wheel-tools-${{ runner.os }}-${{ runner.arch }}-

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.save != 'true' || github.ref != 'refs/heads/main'
      with:
        path: ${{ runner.temp }}/cibuildwheel-cache
        key: wheel-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-versions', '**/pyproject.toml', '.github/workflows/_distribution.yaml') }}
        restore-keys: wheel-tools-${{ runner.os }}-${{ runner.arch }}-
