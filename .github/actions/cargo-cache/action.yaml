name: Cargo downloads
description: Share compiler-independent Cargo downloads across native jobs

inputs:
  save:
    description: Own this runner platform's cache publication
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      with: &cargo-downloads
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.save != 'true' || github.ref != 'refs/heads/main'
      with: *cargo-downloads

    - name: Populate workspace downloads
      if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: cargo fetch --locked
