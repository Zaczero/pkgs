[project]
name = "benchroom"
version = "0.1.0"
description = "Benchmark comparisons and clear, publication-ready charts"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10", "numpy>=1.24", "pyperf>=2.9"]

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../ruff.toml"
