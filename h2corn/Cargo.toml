[package]
name = "h2corn"
version = "1.6.0"
edition = "2024"
publish = false
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "_lib"

[dependencies]
anstream = "0.6"
atoi_simd = { version = "0.18", default-features = false }
bitflags = "2.13"
bytes = "1.11"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
http = "1.3"
itoa = "1.0"
memchr = "2.8"
mimalloc = { version = "0.1.52", default-features = false, features = [
  "local_dynamic_tls"
] }
nohash-hasher = "0.2"
owo-colors = "4.2"
parking_lot = "0.12"
pyo3 = "0.29.0"
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe"] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12"
] }
rustls-pki-types = { version = "1.14", features = ["std"] }
smallvec = { version = "1.15", features = ["const_generics", "union"] }
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "io-util",
  "macros",
  "net",
  "parking_lot",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-rustls = { version = "0.26", default-features = false }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
pyo3-build-config = { version = "0.29.0", features = ["resolve-config"] }

[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

[lints]
workspace = true
