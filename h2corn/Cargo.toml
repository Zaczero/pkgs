[package]
name = "h2corn"
version = "2.0.0"
edition.workspace = true
license = "MIT"
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

[lib]
crate-type = ["cdylib"]
name = "_lib"

[dependencies]
anstream.workspace = true
aws-lc-rs = { version = "1.18.2", default-features = false }
atoi_simd = { version = "0.18", default-features = false }
bitflags = "2.13"
bytes = "1.11"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
http = "1.3"
memchr = "2.8"
mimalloc.workspace = true
owo-colors = "4.2"
parking_lot.workspace = true
pyo3.workspace = true
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "time"] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12"
] }
smallvec = { version = "1.15", features = ["const_generics", "union"] }
thiserror.workspace = true
tokio = { version = "1.48", features = [
  "io-util",
  "macros",
  "net",
  "parking_lot",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-rustls = { version = "0.26", default-features = false }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
pyo3-build-config = { workspace = true, features = ["resolve-config"] }

[dev-dependencies]
rstest.workspace = true
tempfile = "3.27"
tokio = { version = "1.48", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
# `http.response.zerocopysend` duplicates a descriptor the application names by
# integer. Every typed rustix/std entry point wants a `BorrowedFd` first, whose
# safety contract we cannot honour for an unvalidated value -- the raw `fcntl`
# takes the integer directly and reports EBADF instead.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Networking_WinSock",
  "Win32_System_Threading"
] }

[lints]
workspace = true
