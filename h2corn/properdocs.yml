site_name: h2corn
site_description: A blazing-fast HTTP/2 ASGI server for Python, written in Rust. Runs FastAPI, Starlette, Django, Litestar, and any other ASGI 3 application.
site_url: https://h2corn.monicz.dev/
repo_url: https://github.com/Zaczero/pkgs/tree/main/h2corn
repo_name: Zaczero/pkgs

docs_dir: docs
site_dir: site
hooks:
  - ../tools/docs/check_frontmatter.py

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo-light.svg
  favicon: assets/favicon.ico
  palette:
    - media: '(prefers-color-scheme)'
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Material renders ```mermaid fences itself, but its bundle lazy-loads the
# library from unpkg.com unless a global `mermaid` already exists. Serving a
# pinned copy keeps readers off a third-party CDN, keeps the site working
# offline, and stops an upstream 11.x release from re-laying-out the diagrams.
# Not under assets/vendor/: the repository ignores `vendor/`, so a copy there
# would never be committed and every published build would fall back to the CDN.
extra_javascript:
  - assets/javascripts/mermaid-11.17.0.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zaczero/pkgs/tree/main/h2corn
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/h2corn/
  analytics:
    provider: google
    property: G-QY82ZM1HD5
  generator: false

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_config_reference.py
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      css_files:
        - stylesheets/extra.css
      cache_safe: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            members: true
            heading_level: 2
            filters:
              - '!^_'
            extensions:
              - griffe_inherited_docstrings

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - examples
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Guide:
    - Quickstart: quickstart.md
    - Operations: deployment/operations.md
    - Behind a reverse proxy: deployment/proxy.md
    - Direct TLS: deployment/tls.md
    - WebSockets: websockets.md
    - Embedding: embedding.md
  - Reference:
    - Configuration: configuration.md
    - ASGI surface: asgi.md
    - API:
      - api/index.md
      - Server entrypoints: api/server.md
      - Config: api/config.md
      - Types:
        - ASGI applications and aliases: api/applications.md
        - Scopes and extensions: api/scopes.md
        - HTTP scope and messages: api/http.md
        - WebSocket scope and messages: api/websockets.md
        - Lifespan scope and messages: api/lifespan.md
    - Benchmarks: benchmarks.md
  - Help:
    - Support: support.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md

watch:
  - python/h2corn
  - examples
