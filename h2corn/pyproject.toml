[project]
name = "h2corn"
description = "Blazing-fast HTTP/2 ASGI server for Python, written in Rust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = [
  "asgi",
  "fastapi",
  "h2c",
  "http",
  "http2",
  "server",
  "starlette",
  "tls",
  "websocket",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Documentation = "https://h2corn.monicz.dev/"
Homepage = "https://h2corn.monicz.dev/"
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/h2corn"

[project.scripts]
h2corn = "h2corn._server:main"

[project.optional-dependencies]
# Windows does not support uvloop. The suite already runs asyncio-only when it
# is absent -- see `pytest_asyncio_loop_factories` in tests/conftest.py.
uvloop = [
  "uvloop>=0.23.0; sys_platform != 'win32'",
]

[dependency-groups]
pgo = [
  "h11>=0.16.0",
  "h2>=4.2.0",
  "starlette>=0.46.0",
  "trustme>=1.2.0",
  "uvloop>=0.23.0; sys_platform != 'win32'",
  "websockets>=16.0",
]

dev = [
  { include-group = "freethreaded" },
  { include-group = "grpc-interop" },
  "markdownify>=1",
  "matplotlib>=3.10.8",
  "mkdocs-gen-files>=0.5",
  "mkdocs-material>=9.7.7",
  "mkdocs-minify-plugin>=0.8",
  "mkdocstrings[python]>=0.27",
  "properdocs>=1.6",
  "pymdown-extensions>=10.7",
  "pyo3stubs",
]

# Native parser dependencies in dev do not have free-threaded builds.
freethreaded = [
  "benchroom",
  "fastapi>=0.118.0",
  "griffe-inherited-docstrings>=1.0",
  "gunicorn[http2]==26.2.0",
  "h2>=4.2.0",
  "h2corn[uvloop]",
  "hpack>=4.1.0",
  "hypercorn>=0.18.0",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.4",
  "pytest-xdist[psutil]>=3.8",
  "pytest>=9.1",
  "starlette>=0.46.0",
  "trustme>=1.2.0",
  "uvicorn==0.54.0",
  "websockets>=16.0",
]

# Optional gRPC interoperability, benchmark runtimes, and protobuf generation.
grpc-interop = [
  "asgi-lifespan>=2.1.0",
  "buf-bin>=1.72.0",
  "connectrpc>=0.12.1",
  "grpcio>=1.83.1",
  "grpclib>=0.4.9",
  "protoc-gen-connectrpc>=0.12.1",
  "protoc-gen-grpc-py>=0.3.0",
  "protoc-gen-py>=0.3.0",
  "types-grpcio>=1.83.0.20260730",
]

[build-system]
requires = ["maturin~=1.14"]
build-backend = "maturin"

[tool.maturin]
include = [
  { path = "LICENSE*.md", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
]
module-name = "h2corn._lib"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.py[co]"]

[tool.cibuildwheel]
test-command = "python {package}/examples/embedded.py"

[tool.ci]
test-tools = ["rust"]

[tool.ci.pgo]
build = "cp315-manylinux_x86_64"
target = "x86_64-unknown-linux-gnu"
adapter = "bench.pgo.adapter"
test-groups = ["freethreaded", "grpc-interop"]

[tool.pyright]
extraPaths = ["python", "../tools"]
include = ["bench", "python/h2corn", "tests"]
pythonPlatform = "All"
pythonVersion = "3.11"
strict = ["python/h2corn"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint]
extend-select = ["non-capitalized-section-name", "missing-new-line-after-section-name", "missing-dashed-underline-after-section", "missing-section-underline-after-name", "mismatched-section-underline-length", "no-blank-line-after-section", "no-blank-line-before-section", "blank-lines-between-header-and-content", "empty-docstring-section", "missing-section-name-colon"]

[tool.ruff.lint.isort]
known-first-party = ["examples"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# ConnectRPC 0.12.1 imports the pre-0.7 protobuf.wkt modules. Remove once
# ConnectRPC supports protobuf-py's relocated well-known types.
constraint-dependencies = ["protobuf-py<0.7"]
sources = { pyo3stubs = { path = "../pyo3stubs", editable = true }, benchroom = { path = "../benchroom", editable = true } }
