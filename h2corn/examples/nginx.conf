# HTTP/2 to the upstream needs nginx built with ngx_http_v2_module. The feature
# appeared in 1.29.4, but 1.29.4-1.30.0 are affected by CVE-2026-42926 — an
# HTTP/2 request injection in this very module — so deploy 1.30.1+ (stable) or
# 1.31.0+ (mainline). `proxy_pass http://` keeps the upstream hop cleartext
# h2c, so there is no second TLS handshake between proxy and application.

upstream h2corn_backend {
    server 127.0.0.1:8000;

    # Without this every request opens a fresh upstream connection, which is
    # the cost h2c is supposed to remove.
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;

    server_name example.com;
    ssl_certificate     /etc/nginx/certs/example.crt;
    ssl_certificate_key /etc/nginx/certs/example.key;

    # WebSockets first: nginx still speaks the HTTP/1.1 Upgrade handshake and
    # does not translate it into the RFC 8441 extended CONNECT that HTTP/2
    # requires, so upgrade traffic must take its own HTTP/1.1 location. This
    # means h2corn keeps HTTP/1 enabled — do not pass `--no-http1`.
    location /ws {
        proxy_pass http://h2corn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }

    location / {
        proxy_pass http://h2corn_backend;
        proxy_http_version 2;

        # Without this nginx sends the upstream *group* name — here
        # `h2corn_backend` — as Host/`:authority`, which is what host-based
        # routing and TrustedHostMiddleware would then see.
        proxy_set_header Host $host;

        # h2corn is told to trust forwarding headers from this proxy, so this
        # proxy has to be the only thing that can write them. proxy_set_header
        # replaces whatever the client sent; anything h2corn trusts and nginx
        # does not set here is a header the client controls.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }
}
