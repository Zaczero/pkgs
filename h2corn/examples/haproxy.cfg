global
    log stdout format raw daemon

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # An idle WebSocket has to outlive the keepalive that proves it is alive:
    # h2corn's first ping goes out at websocket_ping_interval (60s by default),
    # so a 30s idle timeout would close the connection before it ever pinged.
    timeout tunnel 300s

frontend public_https
    bind :443 ssl crt /etc/haproxy/certs/example.pem alpn h2,http/1.1

    # h2corn is told to trust forwarding headers from this proxy, so this proxy
    # has to be the only thing that can write them. set-header replaces every
    # instance the client sent; anything not set here is deleted rather than
    # passed through, because a header h2corn trusts and HAProxy does not set
    # is a header the client controls.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request del-header X-Forwarded-Prefix
    http-request del-header Forwarded

    default_backend h2corn_backend

backend h2corn_backend
    server app1 127.0.0.1:8000 check proto h2 send-proxy-v2
