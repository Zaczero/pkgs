[package]
name = "gometry-libtiff-sys"
version = "0.1.0"
edition = "2024"
links = "tiff"
build = "build.rs"
publish = false
license-file = "LICENSE.md"
description = "Statically linked libtiff for gometry's bundled PROJ"
repository = "https://github.com/Zaczero/pkgs/tree/main/native/libtiff-sys"

[package.metadata.ci]
submodules = true

[dependencies]
libz-sys = { version = "1.1.29", default-features = false, features = ["static", "stock-zlib"] }

[build-dependencies]
cmake = { path = "../../vendor/cmake-rs/cmake", version = "0.1.58" }
cmake-flags = { path = "../cmake-flags" }

[lints]
workspace = true
