[workspace]
resolver = "3"
members = [
  "blurhash-rs",
  "fast",
  "gometry",
  "h2corn",
  "lrucache-rs",
  "osm-shortlink",
  "polyline-rs",
  "totp-rs",
  "zid",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anstream = "1.0"
libc = "0.2"
libm = "0.2.16"
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }
parking_lot = "0.12.5"
pyo3 = "0.30.1"
pyo3-build-config = "0.30.1"
rstest = { version = "0.27.0", default-features = false }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11.1"
thiserror = "2.0"

[patch.crates-io]
# The released core passes references through futex varargs; remove this pin
# when a release includes the upstream integer-pointer and provenance fixes.
parking_lot_core = { git = "https://github.com/Amanieu/parking_lot", rev = "94d1070a4eceb15002a6fc236556f6a2db50cc5a" }

[workspace.lints.cargo]
# Maturin retains workspace dependencies in each package's source distribution,
# including declarations inherited only by the omitted sibling packages.
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

assert_is_empty = "allow"
branches_sharing_code = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# These crates' `///` comments are the SOURCE for Python numpydoc docstrings
# (gen_stub_docs.py): Parameters/Returns tables need bare `name : type`, but
# doc_markdown wants every kwarg/type backticked and `clippy --fix` would break
# the docs. properdocs --strict is the real doc gate, so this lint is off here.
doc_markdown = "allow"
# Numpydoc Examples show doctest expected values like `['POINT (0 0)']` and
# `'EPSG'`; rustdoc's quote-link heuristic misfires on those. properdocs is the
# real doc gate.
doc_link_with_quotes = "allow"
# Same reason: the `///` first paragraph IS the numpydoc summary, whose length is
# governed by the docs site, not rustdoc's paragraph heuristic.
too_long_first_doc_paragraph = "allow"
# Large lookup tables are intentional where their retained size buys useful work.
# For example, h2corn's 16 KiB HPACK decode table appears once in the extension.
# Review new tables for duplication and artifact cost at their owning package.
large_const_arrays = "allow"
future_not_send = "allow"
imprecise_flops = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
# The Python extension crates and FAST binary keep cross-module internals
# explicitly `pub(crate)`. The inverse, `unreachable_pub` below, narrows stray
# `pub` declarations.
redundant_pub_crate = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
suboptimal_flops = "allow"
unused_self = "allow"

absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
# Geometric formulas follow standard single-letter mathematical notation.
many_single_char_names = "allow"
mem_forget = "warn"
# The assert it asks for also removes the bounds checks that follow it.
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
non_zero_suggestions = "warn"
panic = "warn"
panic_in_result_fn = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
mod_module_files = "warn"
semicolon_inside_block = "warn"
# Coordinate pairs and endpoints use standard mathematical names.
similar_names = "allow"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
# Cohesive single-flow algorithms should not be split merely to meet a line cap.
too_many_lines = "allow"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
# New in clippy 2026: fires on sync impls of async trait methods, but its
# suggested rewrites then trip manual_async_fn / impl-trait-signature-match.
# Until the lint family is coherent, keep idiomatic `async fn` impls.
unused_async_trait_impl = "allow"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_in_future = "warn"
deref_into_dyn_supertrait = "warn"
explicit_outlives_requirements = "warn"
# Keep calls to foreign functions with unwind-permitting ABIs explicit.
ffi_unwind_calls = "warn"
# Edition 2024 moved when temporaries and guards drop, and the change is silent.
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_unsafe_on_extern = "warn"
raw_borrows_via_references = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
# The other half of the edition 2024 drop-timing change.
tail_expr_drop_order = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unit_bindings = "warn"
# Crates are unpublished (only the Python wheels ship), so the narrowest accurate
# visibility is the goal: an item not reachable from the crate's real public API
# should be `pub(crate)`, not `pub`. This drives that narrowing; pair with the
# clippy `redundant_pub_crate = "allow"` above (the two are inverses).
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

# gometry's CMake-built native dependencies are workspace members, so the wildcard
# above does not reach them: give them the same optimized, debug-free settings,
# which also makes their CMake builds Release-type. `trim-paths` hands Cargo's path
# remap to their build scripts, and `gometry/native/cmake_flags.rs` forwards it to
# the C and C++ objects, so every checkout compiles identical objects and the
# compiler cache shares them. gometry's own Rust keeps checkout paths.
[profile.dev.package.proj-sys]
opt-level = 2
debug = false
trim-paths = "all"

[profile.dev.package.gometry-libtiff-sys]
opt-level = 2
debug = false
trim-paths = "all"

# Local optimized builds use thin LTO and default codegen-units. Ordinary
# development builds use the dev profile, including its assertions and checks.
# `strip` is deliberately absent — with `debug` set, Cargo already defaults to
# "none", so naming it would restate a default. Line tables plus the symbol table
# are what turn a panic into a backtrace with names and file:line.
[profile.release]
lto = "thin"
debug = "line-tables-only"
trim-paths = "all"

# Local profiling keeps release code generation and full source-level DWARF.
[profile.profiling]
inherits = "release"
debug = "full"
trim-paths = "none"

# Published artifacts only: maximal optimization, and drop DWARF while keeping the
# symbol table. That yields a demangled call chain without frame-level file:line,
# which costs +4.6% wheel size instead of the +388% that shipping line tables does.
# Invoke as `maturin build --profile release-dist`; plain `--release` uses the fast
# local profile above and would publish the 5x-larger artifact.
[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
