[package]
name = "fast"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Fair command comparisons, useful Linux measurements, and a terminal report"

[lib]
doc = false

[dependencies]
anstream.workspace = true
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc.workspace = true
perf-event-open-sys = "7"
procfs-core = { version = "0.18", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
statrs = { version = "0.19", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
rstest.workspace = true

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[target.'cfg(miri)'.dependencies]
libm = { workspace = true, features = ["force-soft-floats"] }

[lints]
workspace = true

[[bench]]
name = "calibration"
harness = false
