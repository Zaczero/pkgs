[package]
name = "fast"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fair command comparisons, useful Linux measurements, and a terminal report"

[lib]
doc = false

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
perf-event-open-sys = "7"
procfs-core = { version = "0.18", default-features = false }
rand = "0.10"
rand_chacha = "0.10"
rustix = { version = "1.1", features = ["fs", "pipe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = { version = "0.19", default-features = false }
unicode-width = "0.2"

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[lints]
workspace = true

[[bench]]
name = "calibration"
harness = false
