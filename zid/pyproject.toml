[project]
name = "zid"
description = "ZID is a unique identifier with nice properties"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = ["identifier", "primary key", "unique identifier", "uuid"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Zero-Clause BSD (0BSD)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/zid"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-timeout>=2.4", "pytest-xdist[psutil]>=3.8"]

[build-system]
requires = ["maturin~=1.14"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
include = [{ path = "rust-toolchain.toml", format = "sdist" }]
module-name = "zid._lib"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.py[co]"]

[tool.pyright]
include = ["python/zid", "tests"]
pythonPlatform = "All"
pythonVersion = "3.10"
strict = ["python/zid"]

[tool.ruff]
extend = "../ruff.toml"
