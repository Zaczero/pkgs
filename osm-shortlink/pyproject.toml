[project]
name = "osm-shortlink"
description = "OpenStreetMap shortlink encoder and decoder"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = ["decoder", "encoder", "openstreetmap", "osm", "shortlink", "url"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Zero-Clause BSD (0BSD)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/osm-shortlink"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-timeout>=2.4", "pytest-xdist[psutil]>=3.8"]

[build-system]
requires = ["maturin~=1.14"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
include = [{ path = "rust-toolchain.toml", format = "sdist" }]
module-name = "osm_shortlink._lib"
python-source = "python"

[tool.pyright]
include = ["python/osm_shortlink", "tests"]
pythonPlatform = "All"
pythonVersion = "3.10"
strict = ["python/osm_shortlink"]

[tool.ruff]
extend = "../ruff.toml"
