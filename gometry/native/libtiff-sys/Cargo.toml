[package]
name = "gometry-libtiff-sys"
version = "0.1.0"
edition = "2021"
links = "tiff"
build = "build.rs"
publish = false
license-file = "LICENSE.md"
description = "Statically linked libtiff for gometry's bundled PROJ"

[dependencies]
libz-sys = { version = "1.1.29", default-features = false, features = ["static", "stock-zlib"] }

[build-dependencies]
cmake = "0.1"
