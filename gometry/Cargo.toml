[package]
name = "gometry"
version = "0.0.0"
edition.workspace = true
description = "A geospatial engine for Python, written in Rust"
repository = "https://github.com/Zaczero/pkgs/tree/main/gometry"
license = "Apache-2.0 OR MIT"
publish.workspace = true
autobenches = false
include = [
  "/build.rs",
  "/src/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-*",
  "/rust-toolchain.toml",
  "/native/*.rs",
  "/native/source_roots.txt",
]

[lib]
crate-type = ["cdylib"]
name = "gometry"

[dependencies]
ahash = { version = "0.8.12", default-features = false, features = [
  "runtime-rng",
  "std"
] }
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
fast_hilbert = { version = "2.1.0", default-features = false }
geographiclib-rs = { version = "0.2.7", default-features = false, features = [
  "accurate"
] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
# Root-vendored from HydroniumLabs/h3o; vendor/h3o/GOMETRY_DIVERGENCE.md records
# local carriers and correctness fixes.
h3o = { path = "../vendor/h3o", default-features = false, features = [
  "std"
] }
lexical-core = { version = "1.0.6", default-features = false, features = [
  "parse-floats"
] }
libc = { workspace = true, default-features = false }
libm = { workspace = true, default-features = false }
mimalloc.workspace = true
numpy = { path = "../vendor/rust-numpy", version = "0.30.0", default-features = false }
proj-sys = { path = "../vendor/proj-sys", default-features = false, features = [
  "bundled_proj",
  "tiff",
] }
pyo3 = { workspace = true, default-features = false, features = [
  "macros",
  "multiple-pymethods"
] }
rstar = { version = "0.13.0", default-features = false }
serde = { workspace = true, default-features = false, features = ["std"] }
# `float_roundtrip`: correctly-rounded binary64 parse so GeoJSON text→f64→text
# is bit-identical (R15-G). Measured ~+5% on full Value parse of the countries
# fixture vs default. `raw_value` preserves only opaque Feature properties/ids
# until Python conversion, so arbitrary-size JSON integers do not force an
# arbitrary-precision parse of every geometry coordinate. Write path already
# uses zmij shortest-round-trip.
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
  "float_roundtrip",
  "raw_value",
  "unbounded_depth",
] }
smol_str = { version = "0.3.6", default-features = false, features = ["std"] }
thiserror = { workspace = true, default-features = false, features = ["std"] }
zmij = { version = "1.0.21", default-features = false }

[dev-dependencies]
approx = { version = "0.5.1", default-features = false }
rstest.workspace = true
# Differential oracle for gometry's own S2 core (src/grid/s2), test-only.
s2 = { version = "0.2.0", default-features = false }
sha2 = { workspace = true, default-features = false }

[build-dependencies]
pyo3-build-config = { workspace = true, default-features = false }
sha2 = { workspace = true, default-features = false }

[lints]
workspace = true
