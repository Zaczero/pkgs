[package]
name = "gometry"
version = "1.0.0"
edition = "2024"
description = "A geospatial engine for Python, written in Rust"
repository = "https://github.com/Zaczero/pkgs/tree/main/gometry"
license = "Apache-2.0 OR MIT"
publish = false
autobenches = false
include = [
  "/build.rs",
  "/src/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-*",
  "/rust-toolchain.toml",
  "/native/notices/nlohmann-json-license.md",
  "/native/cmake_flags.rs",
  "/native/proj-sys/**",
  "/native/libtiff-sys/**",
  "/native/h3o/**",
]

[lib]
crate-type = ["cdylib"]
name = "gometry"



[dependencies]
ahash = { version = "0.8.12", default-features = false, features = [
  "runtime-rng",
  "std"
] }
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
fast_hilbert = { version = "2.1.0", default-features = false }
geographiclib-rs = { version = "0.2.7", default-features = false, features = [
  "accurate"
] }
getrandom = { version = "0.3", default-features = false, features = ["std"] }
# Vendored from HydroniumLabs/h3o at fa1557fd1edd56f64e4da95b2fd294609ce2353e.
# GOMETRY_DIVERGENCE.md records its raw-carrier API and local safe-traversal fix.
h3o = { path = "native/h3o", default-features = false, features = [
  "std"
] }
lexical-core = { version = "1.0.6", default-features = false, features = [
  "parse-floats"
] }
libc = { version = "0.2", default-features = false }
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }
numpy = { version = "0.29.0", default-features = false }
proj-sys = { path = "native/proj-sys", default-features = false, features = [
  "bundled_proj",
  "tiff",
] }
pyo3 = { version = "0.29.0", default-features = false, features = [
  "macros",
  "multiple-pymethods"
] }
rstar = { version = "0.13.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std"] }
# `float_roundtrip`: correctly-rounded binary64 parse so GeoJSON text→f64→text
# is bit-identical (R15-G). Measured ~+5% on full Value parse of the countries
# fixture vs default. `raw_value` preserves only opaque Feature properties/ids
# until Python conversion, so arbitrary-size JSON integers do not force an
# arbitrary-precision parse of every geometry coordinate. Write path already
# uses zmij shortest-round-trip.
serde_json = { version = "1.0", default-features = false, features = [
  "alloc",
  "float_roundtrip",
  "raw_value",
  "unbounded_depth",
] }
smol_str = { version = "0.3.6", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
zmij = { version = "1.0.21", default-features = false }

[dev-dependencies]
# Differential oracle for gometry's own S2 core (src/grid/s2) — test-only. Upstream still
# pulls unmaintained/unsound cgmath (RUSTSEC-2026-0196/0197); it is excluded
# from production artifacts, and the exercised S2 source never calls the
# affected swap_columns API. AGENTS.md records the release-audit decision.
s2 = { version = "0.1.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[build-dependencies]
pyo3-build-config = { version = "0.29.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[lints]
workspace = true
