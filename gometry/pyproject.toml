[project]
name = "gometry"
description = "A geospatial engine for Python, written in Rust"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = [
  "arrow",
  "crs",
  "geoarrow",
  "geohash",
  "geojson",
  "geoparquet",
  "geometry",
  "geospatial",
  "gis",
  "h3",
  "proj",
  "rust",
  "s2",
  "spatial-index",
  "wkb",
  "wkt",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26; python_version < '3.15'",
  "numpy>=2.5; python_version >= '3.15'",
  "typing-extensions>=4.15; python_version < '3.15'",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://gometry.monicz.dev"
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/gometry"

[project.optional-dependencies]
arrow = ["pyarrow>=24.0.0"]
pandas = ["pandas>=3.0.3"]
polars = ["polars>=1.42.0"]
geopandas = ["geopandas>=1.1.4"]
viz = ["arro3-core", "lonboard>=0.16.0"]

[dependency-groups]
dev = [
  { include-group = "freethreaded" },
  "geopandas>=1.2.0",
  # Source-built H3 on Windows CPython 3.15 lacks its public API; await a wheel.
  "h3>=4.5.0; sys_platform != 'win32' or python_version != '3.15'",
  "libcst",
  "lonboard>=0.16.0; python_version<'3.15'",
  "markdownify>=1",
  "mkdocs-gen-files>=0.5",
  "polars",
  "pygeohash>=3.5.1",
  "pymdown-extensions>=10.7",
  "pyo3stubs",
  "types-geopandas",
]

# Some native integrations and parser tools lack free-threaded wheels.
freethreaded = [
  "arro3-core",
  "benchroom",
  "griffe",
  "markdown",
  "markdown-exec>=1.9",
  "maturin==1.15.0",
  "mercantile>=1.2.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=0.27",
  "mypy>=1.15",
  "pandas",
  "pandas-stubs",
  "properdocs>=1.6",
  "pyarrow>=26.0.0",
  "pyarrow-stubs",
  "pyproj>=3.7.2; python_version<'3.12'",
  "pyproj>=3.8.0; python_version>='3.12'",
  "pytest-cov",
  "pytest-timeout>=2.4",
  "pytest-xdist[psutil]>=3.8",
  "pytest>=9.1",
  "pyyaml",
  "rtree",
  "s2sphere",
  "scikit-learn",
  "shapely>=2.2.0",
]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.ci]
# Keep the geometry suite's interpreter runs parallel on separate runners.
test-batch-size = 1
# Remove when the Python 3.15 development group can include lonboard.
typecheck-python = "3.14"

[tool.cibuildwheel]
test-command = """python -c "import gometry as gm; \
  import numpy as np; \
  p = gm.Point(21, 52, crs=4326); \
  assert p.to_crs(3857).crs == gm.CRS(3857); \
  assert p.buffer(1000).area > 0; \
  assert gm.from_wkb(p.to_wkb(include_srid=True)).crs == p.crs; \
  assert gm.GeometryArray([p, None]).is_missing.tolist() == [False, True]; \
  assert np.asarray(p.coords).shape == (1, 2); \
  assert len(gm.h3_cells([p], resolution=9)) == 1"
"""

[tool.coverage.run]
source = ["python/gometry"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if _?TYPE_CHECKING:", "@overload"]

[tool.maturin]
bindings = "pyo3"
module-name = "gometry._lib"
python-source = "python"
include = [
  { path = "LICENSE-APACHE.md", format = "sdist" },
  { path = "LICENSE-MIT.md", format = "sdist" },
  { path = "LICENSE-THIRD-PARTY.md", format = "sdist" },
  { path = "LICENSE-APACHE.md", format = "wheel" },
  { path = "LICENSE-MIT.md", format = "wheel" },
  { path = "LICENSE-THIRD-PARTY.md", format = "wheel" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
  { path = "tools/wheel_smoke.py", format = "sdist" },
  { path = "tools/_artifact_common.py", format = "sdist" },
  { path = "tools/artifact_content.py", format = "sdist" },
  { path = "tools/source_artifact.py", format = "sdist" },
  { path = "tools/runtime_artifact.py", format = "sdist" },
  { path = "tools/quality_runtime.py", format = "sdist" },
  { path = "tools/release_artifact.py", format = "sdist" },
]
exclude = [
  { path = ".pytest_cache/**", format = "sdist" },
  { path = ".ruff_cache/**", format = "sdist" },
  { path = ".venv/**", format = "sdist" },
  { path = "dist/**", format = "sdist" },
  { path = "fixtures/**", format = "sdist" },
  { path = "htmlcov/**", format = "sdist" },
  { path = "site/**", format = "sdist" },
  { path = "target*/**", format = "sdist" },
  "**/__pycache__/**",
  "**/*.py[co]",
]

[tool.maturin.sbom]
# The generated Rust BOM contains local `path+file://` component references
# for the vendored patches. Those references would expose the ephemeral build
# checkout in a published wheel; the release artifact carries licensing and
# attestation separately, so omit the non-portable Rust BOM.
rust = false

[tool.mypy]
# overload-overlap flags gometry's core scalar/array idiom (a scalar variant
# ordered before a broader batch variant, e.g. `float` before `_FloatInput`,
# `str` before `Iterable[str]`); overload ORDER is the deliberate
# disambiguator, and the batch variant must keep accepting scalars for mixed
# broadcasting (`factors(0.5, lat_column)`). Same practice as numpy/typeshed.
disable_error_code = ["overload-overlap"]
# Type-check this checkout rather than an unrelated installed editable package.
mypy_path = "$MYPY_CONFIG_FILE_DIR/python"

[tool.pyright]
include = ["python/gometry"]
# Resolve package imports against this checkout, not an installed editable copy.
extraPaths = ["python"]
pythonPlatform = "All"
pythonVersion = "3.11"
typeCheckingMode = "standard"
# `_lib` is a compiled extension; its `.pyi` stub is the source for type checking.
reportMissingModuleSource = "none"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
extend = "../ruff.toml"
exclude = [".venv", ".ruff_cache", "site", "target*"]

[tool.ruff.lint]
extend-select = ["non-capitalized-section-name", "missing-new-line-after-section-name", "missing-dashed-underline-after-section", "missing-section-underline-after-name", "mismatched-section-underline-length", "no-blank-line-after-section", "no-blank-line-before-section", "blank-lines-between-header-and-content", "empty-docstring-section", "missing-section-name-colon"]
# Throwaway names are `_` and single-word `_name`s; multi-word `_`-prefixed
# helpers are not, so redefining one still reports F811.
dummy-variable-rgx = "^_[a-z0-9]*$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
# Standalone gate scripts import tools/ siblings via a sys.path shim that must
# precede the import (the _gatelib.py sys.path pattern).
"tools/**/*.py" = ["module-import-not-at-top-of-file"]
# Bench drivers/support scripts use the same late-import sys.path shim pattern.
"benches/**/*.py" = ["module-import-not-at-top-of-file", "unsorted-imports"]
# Pickle round-trips of gometry's own objects are the feature under test; the
# "untrusted data" caveat S301 guards does not apply to self-produced bytes.
"tests/*.py" = ["suspicious-pickle-usage"]
# Deliberate import ordering: facade adapter imports are grouped with the
# native exports, and optional-dependency typing blocks follow their guards.
"python/gometry/__init__.py" = ["module-import-not-at-top-of-file"]
# Frozen slot initialization bypasses Features.__setattr__.
"python/gometry/_types.py" = ["module-import-not-at-top-of-file", "unnecessary-dunder-call"]

[tool.uv]
sources = { pyo3stubs = { path = "../pyo3stubs", editable = true }, benchroom = { path = "../benchroom", editable = true } }
# Build inputs only: test changes must not invalidate the built wheel.
# Key shipped Python/stub sources + explicit native sources — never the
# generated ``_lib*.so`` (matched by a bare ``python/gometry/**`` glob and would
# self-invalidate the uv cache after every maturin develop).
cache-keys = [
  { file = "pyproject.toml" },
  { file = "build.rs" },
  { file = "Cargo.toml" },
  { file = "../Cargo.toml" },
  { file = "../Cargo.lock" },
  { file = "../.cargo/config.toml" },
  { file = "../rust-toolchain.toml" },
  { file = "rust-toolchain.toml" },
  { file = "src/**/*.rs" },
  { file = "native/**/*.rs" },
  { file = "native/**/*.toml" },
  { file = "native/**/*.pin" },
  { file = "native/**/*.c" },
  { file = "native/**/*.cc" },
  { file = "native/**/*.cpp" },
  { file = "native/**/*.cxx" },
  { file = "native/**/*.h" },
  { file = "native/**/*.hh" },
  { file = "native/**/*.hpp" },
  { file = "native/**/*.hxx" },
  { file = "native/**/*.cmake" },
  { file = "native/**/*.in" },
  { file = "native/**/CMakeLists.txt" },
  { file = "native/**/VERSION" },
  { file = "native/source_roots.txt" },
  { file = "../native/**/*" },
  { file = "../vendor/**/*" },
  { file = "../patches/**/*" },
  { file = "python/gometry/**/*.py" },
  { file = "python/gometry/**/*.pyi" },
  { file = "python/gometry/py.typed" },
