target-version = "py311"
preview = true

# Vendored upstream sources keep their own style and lint policy.
extend-exclude = ["vendor"]
force-exclude = true

[per-file-target-version]
".github/scripts/**" = "py311"
"gometry/**" = "py311"
"h2corn/**" = "py311"
"pyo3stubs/**" = "py311"

[lint]
allowed-confusables = ["µ"]
ignore = [
  "unused-function-argument",
  "unused-method-argument",
  "async-function-with-timeout",
  "blocking-path-method-in-async-function",
  "function-call-in-default-argument",
  "lambda-assignment",
  "ambiguous-variable-name",
  "root-logger-call",
  "invalid-argument-name",
  "non-lowercase-variable-in-function",
  "import-outside-top-level",
  "import-private-name",  # Internal modules are shared by package tools and tests.
  "PLR09",  # too-many-*
  "too-many-nested-blocks",
  "redefined-argument-from-local",
  "magic-value-comparison",
  "no-self-use",
  "global-statement",
  "unspecified-encoding",
  "redefined-loop-name",
  "pytest-fixture-incorrect-parentheses-style",
  "pytest-parametrize-names-wrong-type",
  "pytest-composite-assertion",
  "pytest-incorrect-mark-parentheses-style",
  "assignment-default-in-stub",
  "docstring-in-stub",
  "assert",
  "hardcoded-password-string",
  "try-except-pass",
  "suspicious-non-cryptographic-random-usage",
  "suspicious-subprocess-import",
  "suspicious-pickle-import",
  "suspicious-xml-etree-import",
  "S6",
  "suppressible-exception",
  "if-else-block-instead-of-if-exp",
  "raise-vanilla-args",
  "raise-within-try",
  "non-empty-init-module",  # Small packages keep their implementation at the public entry point.
  "reimplemented-starmap",  # Comprehensions are faster on Python 3.12+.
  "literal-membership",  # Short tuples need no hashability contract or dynamic set allocation.
  "too-many-statements-in-try-clause",
  "unused-async",  # ASGI and framework callbacks must retain their async interface.
]
select = [
  "ARG",  # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "unnecessary-multiline-docstring",
  "blank-line-before-function",
  "blank-line-after-function",
  "under-indentation",
  "over-indentation",
  "new-line-after-last-paragraph",
  "surrounding-whitespace",
  "blank-line-before-class",
  "first-word-uncapitalized",
  "overload-with-docstring",
  "empty-docstring",
  "DTZ",  # flake8-datetimez
  "E4",  # pycodestyle
  "E7",
  "E9",
  "F",  # pyflakes
  "FAST",  # fastapi
  "FLY",  # flynt
  "FURB",  # refurb
  "G",  # flake8-logging-format
  "I",  # isort
  "ICN",  # flake8-import-conventions
  "INT",  # flake8-gettext
  "explicit-string-concatenation",
  "LOG",  # flake8-logging
  "N",  # pep8-naming
  "NPY",  # numpy
  "PERF",  # perflint
  "blanket-type-ignore",
  "blanket-noqa",
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PYI",  # flake8-pyi
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "SLOT",  # flake8-slots
  "T10",  # flake8-debugger
  "invalid-todo-capitalization",
  "TC",  # flake8-type-checking
  "relative-imports",
  "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W6",
  "YTT",  # flake8-2020
]
extend-safe-fixes = ["D2"]

[lint.per-file-ignores]
# Native extension stubs attach public documentation to the final canonical
# overload because a .pyi overload set cannot include an implementation body.
"**/_lib.pyi" = ["overload-with-docstring"]
# Protocol tests need direct slots, builtin subclasses, and exact stored values.
"**/tests/**" = [
  "compare-to-empty-string",
  "float-equality-comparison",
  "subclass-builtin",
  "unnecessary-dunder-call",
]
"**/benches/**" = ["float-equality-comparison"]

[lint.flake8-import-conventions]
extend-aliases = { geopandas = "gpd" }
banned-aliases = { geopandas = [] }

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pylint]
allow-dunder-method-names = [
  "__arrow_array__",
  "__arrow_c_array__",
  "__arrow_c_stream__",
  "__arrow_ext_deserialize__",
  "__arrow_ext_serialize__",
  "__from_arrow__",
  "__geo_interface__",
  "__signature__",
]

[format]
# Ruff formats Python code blocks inside Markdown. The docs embed their examples
# with pymdownx snippets -- `--8<-- "hello.py"` inside a ```python fence -- which
# is not Python, and formatting rewrites it to `--8 < --'hello.py'`, breaking the
# include. The fence has to stay `python` for syntax highlighting, so the
# exclusion is what keeps both. It also stops published examples being rewritten
# from double to single quotes into internal house style.
exclude = ["**/*.md"]
quote-style = "single"
