absolute-paths-allowed-crates = ["std", "core", "alloc", "pyo3"]
absolute-paths-max-segments = 3
# Tests are held to ergonomics, not to the production panic budget.
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-large-stack-frames-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-useless-vec-in-tests = true
avoid-breaking-exported-api = false
check-inconsistent-struct-field-initializers = true
disallowed-methods = [
  { path = "slice::sort", reason = "Prefer sort_unstable; stable sorting may allocate and requires a local exception explaining the tie-order requirement." },
  { path = "slice::sort_by", reason = "Prefer sort_unstable_by; stable sorting may allocate and requires a local exception explaining the tie-order requirement." },
  { path = "slice::sort_by_key", reason = "Prefer sort_unstable_by_key; stable sorting may allocate and requires a local exception explaining the tie-order requirement." },
  { path = "slice::sort_by_cached_key", reason = "Cached-key sorting allocates; require a local exception explaining stability and the measured benefit of caching keys." },
]
future-size-threshold = 4096
large-error-threshold = 56
pass-by-value-size-limit = 64
too-large-for-stack = 128
too-many-arguments-threshold = 10
trivial-copy-size-limit = 16
