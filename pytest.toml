[pytest]
minversion = "9.1"
strict = true
required_plugins = [
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
]
filterwarnings = [
  "error",
  # Projection-oracle tests may lack an optional datum grid and then select the
  # next-best transformation; this warning reflects that environment capability.
  "ignore:Best transformation is not available:UserWarning",
]
# Diagnostic, not a budget: pytest arms this with exit=False, so it dumps every
# thread's stack and the test still runs to completion. Below --timeout it fires
# on merely slow tests and buries passing runs in stack traces. Its value is the
# case --timeout cannot reach, a native call that never returns to the
# interpreter and so never lets the timeout thread run.
faulthandler_timeout = "90"
addopts = [
  "-n", "auto",
  "--dist=worksteal",
  "--import-mode=importlib",
  "--timeout-method=thread",
]
