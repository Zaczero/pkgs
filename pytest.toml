[pytest]
minversion = "9.1"
strict = true
required_plugins = [
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
]
filterwarnings = [
  "error",
]
# `--timeout=60` cannot interrupt a native call holding the GIL. Give it another
# 30 seconds, then retain all thread stacks and terminate the stuck pytest worker.
faulthandler_timeout = "90"
faulthandler_exit_on_timeout = true
addopts = [
  "-n", "auto",
  # Large native suites saturate memory and make individual workers miss their
  # timeout when every high-core-count runner is filled. Scale down naturally
  # on small machines, but keep a conservative ceiling for native-heavy suites.
  "--maxprocesses=8",
  "--dist=worksteal",
  "--import-mode=importlib",
  "--timeout=60",
  "--timeout-method=thread",
  "--durations=0",
  "--durations-min=1",
  "-ra",
]
