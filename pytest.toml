[pytest]
minversion = "9.1"
strict = true
required_plugins = [
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
]
filterwarnings = [
  "error",
  # pyproj oracle tests may lack an optional datum grid and then select the
  # next-best transformation. This is an environment capability, not a warning
  # from gometry.
  "ignore:Best transformation is not available:UserWarning",
]
# Diagnostic, not a budget: pytest arms this with exit=False, so it dumps every
# thread's stack and the test still runs to completion. Below --timeout it fires
# on merely slow tests and buries passing runs in stack traces. Its value is the
# case --timeout cannot reach, a native call that never returns to the
# interpreter and so never lets the timeout thread run.
faulthandler_timeout = "90"
markers = [
  "exhaustive: catalog-wide / combinatorial sweeps; opt in explicitly",
]
addopts = [
  "-n", "auto",
  # Large native suites saturate memory and make individual workers miss their
  # timeout when every high-core-count runner is filled. Scale down naturally
  # on small machines, but keep a conservative ceiling for native-heavy suites.
  "--maxprocesses=8",
  "--dist=worksteal",
  "--import-mode=importlib",
  "--timeout=60",
  "--timeout-method=thread",
  "--durations=25",
  "--durations-min=0.25",
  "-ra",
  "-m", "not exhaustive",
]
