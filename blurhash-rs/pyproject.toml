[project]
name = "blurhash-rs"
description = "BlurHash encoder and decoder for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = [
  "blurhash",
  "decoder",
  "encoder",
  "image",
  "loading",
  "placeholder",
  "preview",
  "progressive"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["Pillow>=9.0.0"]
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/blurhash-rs"

[dependency-groups]
dev = [
  "benchroom",
  "blurhash",
  "pytest-timeout>=2.4",
  "pytest-xdist[psutil]>=3.8",
  "pytest>=9.1",
]

compare-cffi = [
  "benchroom",
  "blurhash-python",
]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "compare-cffi" }]]

[tool.uv.sources]
benchroom = { path = "../benchroom", editable = true }

[build-system]
requires = ["maturin~=1.14"]
build-backend = "maturin"

[tool.maturin]
include = [
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
]
module-name = "blurhash_rs._lib"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.py[co]"]

[tool.pyright]
extraPaths = ["python"]
include = ["python/blurhash_rs", "tests"]
pythonPlatform = "All"
pythonVersion = "3.11"
strict = ["python/blurhash_rs"]

[tool.ruff]
extend = "../ruff.toml"
