[project]
name = "lrucache-rs"
description = "Dict-like LRUCache in Rust for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
authors = [{ name = "Kamil Monicz", email = "kamil@monicz.dev" }]
keywords = ["cache", "caching", "lru", "lrucache", "mapping"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Zero-Clause BSD (0BSD)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/Zaczero/pkgs/issues"
Repository = "https://github.com/Zaczero/pkgs/tree/main/lrucache-rs"

[dependency-groups]
pgo = []
dev = [
  { include-group = "freethreaded" },
  "pyperf>=2.9",
  "pyo3stubs",
]

# Native parser dependencies in dev do not have free-threaded builds.
freethreaded = [
  "pytest-timeout>=2.4",
  "pytest-xdist[psutil]>=3.8",
  "pytest>=9.1",
]

[tool.uv]
sources = { pyo3stubs = { path = "../pyo3stubs", editable = true } }

[build-system]
requires = ["maturin~=1.14"]
build-backend = "maturin"

[tool.maturin]
include = [
  { path = "LICENSE*.md", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = ".cargo/config.toml", format = "sdist" },
]
module-name = "lrucache_rs._lib"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.py[co]"]

[tool.ci.pgo]
build = "cp315-manylinux_x86_64"
target = "x86_64-unknown-linux-gnu"
adapter = "tools.pgo"
test-groups = ["freethreaded"]

[tool.pyright]
include = ["python/lrucache_rs", "tests"]
extraPaths = ["python"]
pythonPlatform = "All"
pythonVersion = "3.11"
strict = ["python/lrucache_rs"]

[tool.ruff]
extend = "../ruff.toml"
