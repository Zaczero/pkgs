[profile.default]
slow-timeout = { period = "1s", terminate-after = 10, grace-period = "1s" }
leak-timeout = { period = "1s", result = "fail" }
fail-fast = false
status-level = "leak"

[profile.ci]
# Report slow tests without terminating them.
slow-timeout = "60s"
status-level = "pass"

[profile.ci.junit]
path = "junit.xml"

[profile.default-miri]
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "1s" }

[profile.default-miri.junit]
path = "junit.xml"
report-name = "miri"
